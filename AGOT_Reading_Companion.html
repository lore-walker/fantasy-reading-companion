<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Game of Thrones — Reading Companion</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #1a1208;
    color: #e8dbb8;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #header {
    background: #0d0a04;
    border-bottom: 1px solid #5a3e1a;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  #title {
    font-size: 18px;
    color: #c8a850;
    letter-spacing: 2px;
    font-variant: small-caps;
    white-space: nowrap;
  }

  #homeLink {
    font-size: 14px;
    color: #8a7040;
    text-decoration: none;
    margin-right: 4px;
    transition: color 0.15s;
  }
  #homeLink:hover { color: #c8a850; }

  .nav-btn {
    width: 32px; height: 32px;
    border-radius: 6px;
    border: 1px solid #5a3e1a;
    background: #1a1208;
    color: #c8a850;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.12s;
    flex-shrink: 0;
  }
  .nav-btn:hover { background: #2a1e08; border-color: #8a6030; }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }

  #chDisplay {
    font-size: 13px;
    color: #c8a850;
    white-space: nowrap;
    min-width: 180px;
    font-family: Georgia, serif;
  }
  #chDisplay span { color: #8a7040; font-size: 12px; }

  #jumpMenu, #bookMenu {
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px solid #5a3e1a;
    background: #1a1208;
    color: #c8a850;
    cursor: pointer;
    max-width: 200px;
    font-family: Georgia, serif;
  }

  .filter-btn {
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid #5a3e1a;
    background: #1a1208;
    color: #8a7040;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    font-family: Georgia, serif;
  }
  .filter-btn.active { background: #2a1e08; color: #c8a850; border-color: #8a6030; }
  .filter-btn:hover { background: #2a1e08; color: #c8a850; }

  #recapPanel {
    background: #140f06;
    border-bottom: 1px solid #3a2a0a;
    padding: 8px 16px;
    font-size: 13px;
    color: #b89a54;
    font-family: Georgia, serif;
    line-height: 1.5;
    flex-shrink: 0;
  }
  #recapPanel .recap-tag {
    color: #c8a850;
    font-variant: small-caps;
    letter-spacing: 0.5px;
  }
  #recapPanel .recap-sep { color: #4a3a18; margin: 0 8px; }
  #recapPanel strong { color: #e8dbb8; font-weight: normal; }

  #mapWrap {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
  }

  #map {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    background: #1a2a3a;
  }

  /* ── First-POV Debut Reveal ──────────────────────────────────────────── */
  /* The map itself dims/desaturates under the overlay rather than being
     replaced by a solid block, so there's a faint sense of "the world is
     still there, just not in focus yet" behind the reveal. */
  #map.debut-dimmed {
    filter: grayscale(0.9) brightness(0.32) contrast(1.05);
    transition: filter 1.1s ease;
  }
  #map { transition: filter 0.6s ease; }

  #debutOverlay {
    position: absolute;
    inset: 0;
    z-index: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, rgba(10,7,3,0.35) 0%, rgba(6,4,2,0.72) 65%, rgba(4,3,1,0.85) 100%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.9s ease;
  }
  #debutOverlay.visible { opacity: 1; pointer-events: auto; }

  #debutName {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(2.2rem, 6vw, 4.2rem);
    font-variant: small-caps;
    letter-spacing: 0.28em;
    padding-left: 0.28em; /* compensate for the trailing letter-spacing gap */
    color: #f0d488;
    background: linear-gradient(100deg, #b9863a 0%, #f5deA0 45%, #e8c878 55%, #b9863a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    clip-path: inset(0 100% 0 0);
    text-shadow: 0 0 0 rgba(240, 212, 136, 0);
  }
  #debutOverlay.revealing #debutName {
    animation: debutReveal 2.3s cubic-bezier(.32,.02,.18,1) forwards;
  }
  @keyframes debutReveal {
    0%   { clip-path: inset(0 100% 0 0); text-shadow: 0 0 0 rgba(240,212,136,0); }
    55%  { text-shadow: 0 0 22px rgba(240,212,136,0.85); }
    85%  { clip-path: inset(0 0 0 0); text-shadow: 0 0 22px rgba(240,212,136,0.7); }
    100% { clip-path: inset(0 0 0 0); text-shadow: 0 0 8px rgba(240,212,136,0.35); }
  }

  /* One-time flourish on a debut character's own banner the moment it first
     appears (chapter "finished") — glow in, not a position/scale change, so
     it never fights Leaflet's own transform on the marker. */
  .ribbon-label.debut-reveal svg {
    animation: debutBannerReveal 1.5s ease-out;
  }
  @keyframes debutBannerReveal {
    0%   { opacity: 0; filter: drop-shadow(0 0 0 rgba(240,212,136,0)); }
    45%  { opacity: 1; filter: drop-shadow(0 0 14px rgba(240,212,136,0.9)); }
    100% { opacity: 1; filter: drop-shadow(0 0 0 rgba(240,212,136,0)); }
  }

  .leaflet-control-zoom a {
    background: #1a1208 !important;
    color: #c8a850 !important;
    border-color: #5a3e1a !important;
    font-family: Georgia, serif;
  }
  .leaflet-control-zoom a:hover { background: #2a1e08 !important; }

  /* Custom ribbon marker styles */
  .ribbon-label {
    background: none !important;
    border: none !important;
  }

  /* Panel overlay */
  #panelOverlay {
    position: fixed;
    top: 60px; right: 0;
    width: 340px;
    max-height: calc(100vh - 70px);
    background: #0d0a04;
    border-left: 1px solid #5a3e1a;
    border-bottom: 1px solid #5a3e1a;
    display: none;
    flex-direction: column;
    z-index: 1000;
    font-family: Georgia, serif;
  }
  #panelOverlay.open { display: flex; }
  #panelHeader {
    padding: 10px 14px;
    background: #1a1208;
    border-bottom: 1px solid #5a3e1a;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    color: #c8a850;
    letter-spacing: 1px;
    font-variant: small-caps;
    flex-shrink: 0;
  }
  #panelClose {
    cursor: pointer;
    font-size: 18px;
    color: #8a7040;
    line-height: 1;
  }
  #panelClose:hover { color: #c8a850; }
  #panelBody {
    overflow-y: auto;
    flex: 1;
    padding: 12px;
  }

  .char-card {
    border: 1px solid #3a2a0a;
    border-radius: 6px;
    margin-bottom: 8px;
    overflow: hidden;
    background: #120e04;
  }
  .char-card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .char-card-header:hover { background: #1a1208; }
  .char-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .char-name { font-size: 13px; color: #c8a850; flex: 1; }
  .char-role { font-size: 11px; color: #6a5030; }
  .char-status {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 10px;
    white-space: nowrap;
  }
  .status-dead { background: #3a1010; color: #c05050; }
  .status-missing { background: #2a2a10; color: #a09050; }
  .status-alive { background: #0a2010; color: #50a050; }
  .char-expand { font-size: 11px; color: #6a5030; margin-left: 4px; }
  .char-detail {
    padding: 10px 12px;
    border-top: 1px solid #2a1a0a;
    background: #0a0804;
    font-size: 12px;
    color: #8a7a50;
    line-height: 1.7;
    display: none;
  }
  .char-detail.open { display: block; }
  .char-detail strong { color: #c8a850; font-weight: normal; }
  .reveal-tier { margin-bottom: 6px; }
  .reveal-tier + .reveal-tier {
    border-top: 1px dashed #2a1a0a;
    padding-top: 6px;
    margin-top: 2px;
  }
  .fate-note { color: #c05050 !important; margin-top: 6px; }
  .missing-note { color: #a09050 !important; margin-top: 6px; }

  #statusBar {
    background: #0d0a04;
    border-top: 1px solid #3a2a0a;
    padding: 5px 16px;
    font-size: 11px;
    color: #5a4a20;
    font-family: Georgia, serif;
    font-style: italic;
    flex-shrink: 0;
  }

  /* Tooltip */
  .leaflet-tooltip.ribbon-tip {
    background: #0d0a04;
    border: 1px solid #5a3e1a;
    color: #c8a850;
    font-family: Georgia, serif;
    font-size: 12px;
    line-height: 1.6;
    padding: 8px 12px;
    border-radius: 6px;
    max-width: 220px;
    width: 220px;
    white-space: normal;
    word-wrap: break-word;
    box-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  .leaflet-tooltip.ribbon-tip::before { display: none; }

  .tip-name { font-size: 13px; color: #c8a850; font-variant: small-caps; letter-spacing: 1px; }
  .tip-dead { color: #c05050; font-size: 11px; margin-top: 2px; }
  .tip-missing { color: #a09050; font-size: 11px; margin-top: 2px; }
  .tip-place { color: #8a7040; font-size: 11px; margin-top: 2px; }
  .tip-note { color: #a09060; font-size: 11px; margin-top: 2px; }

  .empty-note {
    font-size: 13px;
    color: #5a4a20;
    font-style: italic;
    padding: 8px 0;
    font-family: Georgia, serif;
  }

  /* ── Mobile ── */
  @media (max-width: 700px) {
    #header {
      padding: 8px 10px;
      gap: 8px;
    }
    #title {
      font-size: 14px;
      letter-spacing: 1px;
    }
    .nav-btn {
      width: 40px;
      height: 40px;
      font-size: 18px;
    }
    #chDisplay {
      font-size: 12px;
      min-width: 0;
    }
    #jumpMenu, #bookMenu {
      max-width: 140px;
      font-size: 12px;
      padding: 8px 6px;
    }
    .filter-btn {
      font-size: 12px;
      padding: 9px 12px;
    }
    /* Full-screen panel overlay on small screens */
    #panelOverlay {
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 100vh;
      max-height: 100vh;
      border-left: none;
    }
    /* Wider, more finger-friendly tooltips */
    .leaflet-tooltip.ribbon-tip {
      max-width: 220px;
      font-size: 13px;
    }
    #recapPanel {
      font-size: 12px;
      padding: 7px 10px;
    }
  }
</style>
</head>

// ─── DATA ────────────────────────────────────────────────────────────────────

const allChars = [
  // ─── POV CHARACTERS ───
  {id:"ned", name:"Ned Stark", house:"Stark", role:"Lord of Winterfell",

      "vaesdothrak": 1.00
    }
  }
};

// Interpolate a position along a road's waypoints at a given percentage (0–1).
// Returns a Leaflet [lat, lng] coordinate, or null if the road has no waypoints yet.
function getRoadPos(roadId, pct) {
  const road = roads[roadId];
  if (!road || !road.waypoints || road.waypoints.length < 2) return null;

  // Resolve named stop to a number
  if (typeof pct === 'string') {
    const named = road.stops[pct.toLowerCase()];
    if (named === undefined) { console.warn('Unknown stop:', pct); return null; }
    pct = named;
  }

  pct = Math.max(0, Math.min(1, pct));

  const total = roadTotalLength(roadId);
  return roadPosAtDistance(roadId, pct * total);
}

// Cached cumulative-distance arrays per road, so the animation loop (which
// calls roadPosAtDistance() on every frame) doesn't rebuild this every time.
const _roadDistCache = {};
function roadDistances(roadId){
  if(_roadDistCache[roadId]) return _roadDistCache[roadId];
  const pts = roads[roadId].waypoints;
  const dists = [0];
  for (let i = 1; i < pts.length; i++) {
    const dlat = pts[i][0] - pts[i-1][0];
    const dlng = pts[i][1] - pts[i-1][1];
    dists.push(dists[i-1] + Math.sqrt(dlat*dlat + dlng*dlng));
  }
  _roadDistCache[roadId] = dists;
  return dists;
}
function roadTotalLength(roadId){
  const dists = roadDistances(roadId);
  return dists[dists.length - 1];
}
// Absolute distance (not 0–1 pct) along the road for a given pct/named stop —
// used so the movement animation can tween in distance-space between two
// pct values while still following the actual waypoints, not a straight line.
function roadDistanceAt(roadId, pct){
  const road = roads[roadId];
  if(!road) return 0;
  if (typeof pct === 'string') {
    const named = road.stops[pct.toLowerCase()];
    if (named === undefined) return 0;
    pct = named;
  }
  pct = Math.max(0, Math.min(1, pct));
  return pct * roadTotalLength(roadId);
}
// Find the [lat,lng] at an absolute distance along a road's waypoints.
function roadPosAtDistance(roadId, dist){
  const pts = roads[roadId].waypoints;
  const dists = roadDistances(roadId);
  const total = dists[dists.length - 1];
  const target = Math.max(0, Math.min(total, dist));

  for (let i = 1; i < pts.length; i++) {
    if (dists[i] >= target) {
      const segLen = dists[i] - dists[i-1];
      const t = segLen > 0 ? (target - dists[i-1]) / segLen : 0;
      return [
        pts[i-1][0] + t * (pts[i][0] - pts[i-1][0]),
        pts[i-1][1] + t * (pts[i][1] - pts[i-1][1])
      ];
    }
  }
  return pts[pts.length - 1];
}

function traceFinish() {
  if (traceWaypoints.length < 2) {
    alert('Please click at least 2 points along the route before finishing.');
    return;
  }

  if (traceCustomTarget) {
    // Custom character route (from the 🧭 Untraced Routes tool) — write
    // straight onto that arrival's own `route` field, live, so it's
    // immediately usable, and also print paste-ready output for saving it
    // back into the actual character data in the code.
    traceCustomTarget.nextArrival.route = traceWaypoints.slice();

    const waypointStr = traceWaypoints.map(([lat,lng]) =>
      `    [${Math.round(lat)}, ${Math.round(lng)}]`
    ).join(',\n');
    const output = `// Paste this "route" field onto ${traceCustomTarget.charName}'s arrival entry\n// (place: "${traceCustomTarget.toPlace}") in the code:\nroute: [\n${waypointStr}\n],`;

    const outEl = tracePanel.querySelector('#traceOutput');
    outEl.textContent = output;
    outEl.style.display = 'block';
    navigator.clipboard.writeText(output).catch(()=>{});

    modeBanner.textContent = `✓ ${traceCustomTarget.charName}'s route to ${traceCustomTarget.toPlace} traced (${traceWaypoints.length} points) — copied to clipboard! Active for this session; paste into the code to keep it.`;

    traceMarkers.forEach(m => map.removeLayer(m));
    traceMarkers = [];
    if (tracePolyline) { map.removeLayer(tracePolyline); tracePolyline = null; }

    const finishedLine = L.polyline(traceCustomTarget.nextArrival.route, {
      color: '#f0c040', weight: 2, opacity: 0.5
    }).addTo(map);
    window._roadLines = window._roadLines || [];
    window._roadLines.push(finishedLine);

    toolMode = 'off';
    map.getContainer().style.cursor = '';
    tracePanel.querySelector('#traceCount').textContent = traceWaypoints.length + ' points ✓';
    traceCustomTarget = null;
    renderMarkers(curCh);
    return;
  }

  // Write waypoints into the live roads object immediately
  roads[traceRoadId].waypoints = traceWaypoints.slice();

  // Build output string for copy-paste into code
  const waypointStr = traceWaypoints.map(([lat,lng]) =>
    `  [${Math.round(lat)}, ${Math.round(lng)}]`
  ).join(',\n');

  const output = `// Paste this into roads.${traceRoadId}.waypoints:\n[\n${waypointStr}\n]`;

  const outEl = tracePanel.querySelector('#traceOutput');
  outEl.textContent = output;
  outEl.style.display = 'block';

  // Copy to clipboard
  navigator.clipboard.writeText(`[\n${waypointStr}\n]`).catch(()=>{});

  modeBanner.textContent = `✓ ${roads[traceRoadId].name} traced (${traceWaypoints.length} points) — copied to clipboard! Road is now active.`;

  // Clean up trace visuals but keep panel open so user can copy output
  traceMarkers.forEach(m => map.removeLayer(m));
  traceMarkers = [];
  if (tracePolyline) { map.removeLayer(tracePolyline); tracePolyline = null; }

  // Draw the finished road as a permanent preview
  const finishedLine = L.polyline(roads[traceRoadId].waypoints, {
    color: '#f0c040', weight: 2, opacity: 0.5
  }).addTo(map);
  window._roadLines = window._roadLines || [];
  window._roadLines.push(finishedLine);

  toolMode = 'off';
  map.getContainer().style.cursor = '';
  tracePanel.querySelector('#traceCount').textContent = traceWaypoints.length + ' points ✓';

  // Refresh markers — road positions will now resolve correctly
  renderMarkers(curCh);
}

// ─── STATE ───────────────────────────────────────────────────────────────────

let curCh = 1;
let curPhase = 'before'; // 'before' = opening the chapter, 'after' = just finished it
let showDeceased = true;
let openPanelId = null;
let freeLook = false;

// The "snap to character" zoom (used when advancing chapters) was zoomed in
// too far. This pulls it back by 1 zoom level on desktop and 2 on mobile —
// mobile screens are smaller, so the same zoom level feels more cropped.
// 700px matches the @media breakpoint used for the mobile layout above.
function getSnapZoom(){
  return window.innerWidth <= 700 ? -1.0 : 0.0;
}
const markers = {};
// Persistent location dots, one per character id but shared by reference
// when characters occupy the same spot — see renderMarkers() and
// runMoveBatch(). This is the "ground truth" location marker; the ribbon
// (in `markers`) is just its label and can fan out for readability.
const dots = {};

// ─── CHAPTER NAV ─────────────────────────────────────────────────────────────

const menu = document.getElementById('jumpMenu');
allChapters.forEach(c => {
  const o = document.createElement('option');
  o.value = c.n;
  o.textContent = `Ch. ${c.n} — ${c.name}`;
  menu.appendChild(o);
});

function getChObj(n){ return allChapters.find(c=>c.n===n) || {n, name:"Chapter "+n}; }

// Each chapter has two stops: Before N (index 2N) and After N (index 2N+1).
// Stepping ±1 in index-space moves through Before/After in the right order:
// ...Before 1, After 1, Before 2, After 2...
function toIndex(ch, phase){ return ch * 2 + (phase === 'after' ? 1 : 0); }
function fromIndex(idx){ return { ch: Math.floor(idx / 2), phase: (idx % 2 === 0) ? 'before' : 'after' }; }
const MIN_STEP = toIndex(0, 'before');
const MAX_STEP = toIndex(72, 'after');

let animating = false; // guards against overlapping tweens on rapid clicks

function stepCh(dir){
  if(animating) return; // ignore clicks mid-animation rather than stack transitions
  const idx = Math.max(MIN_STEP, Math.min(MAX_STEP, toIndex(curCh, curPhase) + dir));
  const next = fromIndex(idx);
  // Only animate the single step from a chapter's own "opening" to its own
  // "finished" (dir>0 while curPhase is 'before' always lands on the SAME
  // chapter's 'after' — see toIndex/fromIndex). Crossing from one chapter's
  // "finished" into the next chapter's "opening" stays instant, and so do
  // jumps and stepping backward — there's no single chapter's story being
  // walked through in either of those cases.
  const isSameChapterAdvance = dir > 0 && curPhase === 'before' && next.ch === curCh && next.phase === 'after';
  if(isSameChapterAdvance){
    advanceChapterAnimated(next.ch, next.phase);
  } else {
    setChapter(next.ch, next.phase);
  }
}
// Jumping via the dropdown always lands on Before N — a deliberate refresher
// stop, not a full skip into what N contains.
function jumpTo(val){ if(val) setChapter(parseInt(val), 'before'); }

// ─── CHARACTER LOGIC ─────────────────────────────────────────────────────────

function resolvePos(entry) {
  // Road entry format: { from, to, road:"kingsroad", pct:0.45, place:"...", note:"..." }
  // pct can also be a named stop string e.g. pct:"winterfell"
  // Raw px() entries pass through unchanged.
  if (!entry || !entry.road) return entry;
  const resolved = getRoadPos(entry.road, entry.pct);
  if (!resolved) {
    console.warn(`Road "${entry.road}" has no waypoints yet. Use ✏️ Trace Road to record it.`);
    return null;
  }
  return { from: entry.from, to: entry.to, pos: resolved, place: entry.place, note: entry.note, status: entry.status };
}

// ─── ARRIVAL / TRANSIT MODEL (Session 14) ──────────────────────────────────
// A position entry is one of two kinds:
//   kind:"arrival" — a real, textually-confirmed place. Eligible to be
//                    shown as "last known position" and to move the
//                    resting marker. Defaults to "arrival" when omitted
//                    (safe default for entries not yet reclassified).
//   kind:"transit" — describes travel between two arrivals (a road/pct or
//                    a rough px() waypoint). NEVER changes "place" or the
//                    resting marker. Only used for (a) an optional note
//                    override, shown while the reader is between arrivals
//                    (e.g. "planning to set sail" without actually moving
//                    the marker), and (b) building the animated route once
//                    the NEXT arrival is confirmed.
// Position Rule 1 (PROJECT_CONTEXT.md) no longer allows "departure or
// arrival" to move the marker — only arrival. A transit entry, however
// specific its wording, is explicitly excluded from that gate.
function isArrival(p){ return (p.kind || 'arrival') === 'arrival'; }
function isTransit(p){ return p.kind === 'transit'; }

// The confirmed arrival active at ch/curPhase — same phase-aware search as
// before, but restricted to arrival entries only.
function getActiveArrival(c, ch){
  // AT6 (Session 15) removed the firstChapter gate entirely so a character
  // could show a position before their own POV debut (e.g. Sansa at
  // Winterfell in ch4, ahead of her ch15 debut). That's superseded now: a
  // POV character's own first-ever series appearance is a spoiler-sensitive
  // moment on its own (see the First-POV Debut Reveal below), so the gate is
  // back — UNLESS this character is marked `continuingPOV:true`, meaning
  // they already had their own POV chapter in an earlier book. For a
  // continuing character, THIS book's `firstChapter` isn't a debut at all —
  // it's just where this book's own narration catches up to them — so they
  // may still carry a position from before it (typically a `from:0` entry
  // picking up where the previous book left off).
  if(!c.continuingPOV && !isRevealed(c.firstChapter, ch, curPhase)) return null;
  if(!c.positions || c.positions.length === 0) return null;
  const arrivals = c.positions.filter(isArrival);
  if(!arrivals.length) return null;
  for(let p of arrivals) if(isRevealed(p.from, ch, curPhase) && ch <= p.to) return p;
  let lastKnown = null;
  for(let p of arrivals){ if(isRevealed(p.from, ch, curPhase)) lastKnown = p; }
  return lastKnown; // null if nothing has been revealed yet — correctly hidden
}

// A transit entry's note can surface WITHOUT moving the marker — e.g.
// "planning to set sail for King's Landing" at the chapter that actually
// says so, while "place" stays frozen at the last real arrival.
function getActiveTransitNote(c, ch){
  if(!c.positions) return null;
  // Same debut gate as getActiveArrival() above — without this, a transit
  // note could leak a not-yet-revealed character's travel status even
  // though getActiveArrival() itself correctly returns null for them.
  if(!c.continuingPOV && !isRevealed(c.firstChapter, ch, curPhase)) return null;
  // A transit's note only applies while the reader hasn't yet reached the
  // arrival it leads into — once that arrival is itself active (its own
  // "from" is later than this transit's), the transit is in the past and
  // must not keep overriding the new arrival's own note. This matters
  // because transit ranges are deliberately extended through the arrival
  // chapter's own "opening" (see Session 14 CHANGELOG) so the note doesn't
  // revert oddly right before arrival — but that means the transit and the
  // next arrival briefly share the same chapter number, and only phase
  // (via the active-arrival comparison below) can tell them apart.
  const activeArrival = getActiveArrival(c, ch);
  for(let p of c.positions){
    if(!isTransit(p)) continue;
    if(!isRevealed(p.from, ch, curPhase) || ch > p.to) continue;
    if(activeArrival && activeArrival.from > p.from) continue;
    return p.note;
  }
  return null;
}

function getPos(c, ch){
  const arrival = getActiveArrival(c, ch);
  if(!arrival) return null;
  const resolved = resolvePos(arrival);
  if(!resolved) return null;
  const transitNote = getActiveTransitNote(c, ch);
  return transitNote !== null ? { ...resolved, note: transitNote } : resolved;
}

// Kept for callers that still want the raw (unresolved) ARRIVAL entry —
// e.g. anything checking a character's current road/pct outside of an
// animation. Multi-leg animation (below) uses getTransitChain() instead,
// since it needs every leg between two arrivals, not just one.
function getRawPosEntry(c, ch){
  return getActiveArrival(c, ch);
}

// Every transit entry strictly between two arrivals, in the order they
// appear in c.positions (the array is expected to stay chronological).
// This is what the animation walks as one continuous multi-stop flight,
// however many now-finished chapters those legs were originally attached
// to — e.g. Catelyn's Winterfell -> White Harbor -> at sea -> King's
// Landing, all animated in the single step where King's Landing (the next
// arrival) is confirmed, per Session 14's reveal model.
function getTransitChain(c, prevArrival, nextArrival){
  if(!c.positions) return [];
  const startIdx = c.positions.indexOf(prevArrival);
  const endIdx = c.positions.indexOf(nextArrival);
  if(startIdx === -1 || endIdx === -1 || endIdx <= startIdx) return [];
  return c.positions.slice(startIdx + 1, endIdx).filter(isTransit);
}

// Every arrival-to-arrival journey still relying on a straight-line
// approximation (no real traced route, and no single named road covers the
// whole hop) — surfaced in the 🧭 Untraced Routes dev tool so someone can
// walk the actual path and send back real waypoints, the same workflow as
// ✏️ Trace Road for the shared named roads.
const UNTRACED_LENGTH_THRESHOLD = 200; // map units — skip trivial local hops
function getUntracedFlights(){
  const results = [];
  allChars.filter(c => c.isPov).forEach(c => {
    const arrivals = (c.positions || []).filter(isArrival);
    for(let i = 1; i < arrivals.length; i++){
      const prevArrival = arrivals[i-1], nextArrival = arrivals[i];
      if(nextArrival.route && nextArrival.route.length > 1) continue; // already traced
      const legs = buildFlightPath(c, prevArrival, nextArrival);
      const hasUntracedStraight = legs.some(leg => leg.kind === 'straight' && leg.length > UNTRACED_LENGTH_THRESHOLD);
      if(hasUntracedStraight){
        results.push({ charId: c.id, charName: c.name, fromPlace: prevArrival.place, toPlace: nextArrival.place, prevArrival, nextArrival });
      }
    }
  });
  return results;
}

// ─── READING MODEL ──────────────────────────────────────────────────────────
// Every gate in the app (tiers, deaths, panel intros, tooltip notes) answers
// the same question: "has the reader gotten far enough to know this yet?"
// There are two states per chapter, not one:
//   Before Chapter N — about to read N. Reveal chapter must be strictly
//                      earlier than N (revealChapter < N).
//   After Chapter N  — just finished N. Reveal chapter may equal N
//                      (revealChapter <= N), since N's own events now count.
// isRevealed() is the single place that encodes this, so every gate in the
// file compares against the same rule instead of picking its own operator.
function isRevealed(revealChapter, ch, phase){
  return phase === 'after' ? revealChapter <= ch : revealChapter < ch;
}

function isDeadAt(c, ch){ return c.deathChapter !== null && isRevealed(c.deathChapter, ch, curPhase) && c.deathStatus === 'dead'; }
function isMissingAt(c, ch){ return c.deathChapter !== null && isRevealed(c.deathChapter, ch, curPhase) && c.deathStatus === 'missing'; }

function buildTierText(c, ch){
  return c.tiers.filter(t => isRevealed(t.revealChapter, ch, curPhase)).map(t => t.text).join(' ');
}

// ─── RIBBON MARKERS ──────────────────────────────────────────────────────────

function makeRibbonHTML(name, ink, isDead, isMissing, textInk){
  const displayInk = (isDead || isMissing) ? '#666' : ink;
  const textColor = (isDead || isMissing) ? '#aaa' : (textInk || '#f5ecd0');
  const opacity = (isDead || isMissing) ? 0.55 : 1;
  const strike = (isDead || isMissing) ? 'text-decoration:line-through;' : '';
  // Banner size — bumped up from the original 7.5/20 so names read
  // clearly on the map. Keep charW, w, and totalW in sync with the
  // iconW calc in renderMarkers() below, or the ribbon will be
  // mis-centered on its marker position.
  const charW = 9.5;
  const w = name.length * charW + 26;
  const h = 26;
  const totalW = w + 26; // include tails
  const cx = totalW / 2;

  return `<svg width="${totalW}" height="${h+8}" xmlns="http://www.w3.org/2000/svg" style="opacity:${opacity}">
    <!-- left tail -->
    <polygon points="${13},${h*0.25} 0,${h*0.5} ${13},${h*0.75}" fill="${displayInk}" opacity="0.8"/>
    <!-- right tail -->
    <polygon points="${totalW-13},${h*0.25} ${totalW},${h*0.5} ${totalW-13},${h*0.75}" fill="${displayInk}" opacity="0.8"/>
    <!-- body -->
    <path d="M13,2 Q${cx},0 ${totalW-13},2 L${totalW-13},${h-2} Q${cx},${h} 13,${h-2} Z" fill="${displayInk}" opacity="0.92"/>
    <!-- highlight -->
    <path d="M17,6 Q${cx},3 ${totalW-17},6" stroke="#fff" stroke-width="1" fill="none" opacity="0.25"/>
    <!-- text -->
    <text x="${cx}" y="${h*0.65}" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-style="italic" fill="${textColor}" style="${strike}" letter-spacing="0.4">${name}</text>
    <!-- anchor dot -->
    <circle cx="${cx}" cy="${h+4}" r="2.5" fill="${displayInk}" opacity="0.7"/>
  </svg>`;
}

// Pure state computation — no DOM/Leaflet calls. Figures out, for a given
// chapter, which POV characters are visible, what their true location
// (anchorPos) and fanned-out label position (ribbonPos) are, and the raw
// position entry behind it (for road-following animation). Returns an
// object keyed by character id. renderMarkers() (below) is just this plus
// the Leaflet drawing calls; the marker-movement animation calls this twice
// (before and after a step) to diff what actually moved.
function computeMarkerState(ch){
  const povChars = allChars.filter(c => c.isPov);
  const groups = {};
  povChars.forEach(c => {
    const pos = getPos(c, ch);
    if(!pos) return;
    const dead = isDeadAt(c, ch);
    const missing = isMissingAt(c, ch);
    if((dead || missing) && !showDeceased) return;
    const rawEntry = getRawPosEntry(c, ch);
    const key = pos.pos[0] + ',' + pos.pos[1];
    if(!groups[key]) groups[key] = {anchorPos: pos.pos, chars: []};
    groups[key].chars.push({c, pos, dead, missing, rawEntry});
  });

  const state = {};
  Object.values(groups).forEach(group => {
    const {anchorPos, chars} = group;
    const fanOffsets = getFanOffsets(chars.length, anchorPos);
    chars.forEach(({c, pos, dead, missing, rawEntry}, i) => {
      state[c.id] = {
        c, pos, dead, missing, rawEntry, anchorPos,
        ribbonPos: fanOffsets[i],
        needsLeader: chars.length > 1
      };
    });
  });
  return state;
}

function renderMarkers(ch, debutRevealId){
  // Clear existing markers and leader lines
  Object.values(markers).forEach(m => map.removeLayer(m));
  Object.keys(markers).forEach(k => delete markers[k]);
  if(window._leaderLines){
    window._leaderLines.forEach(l => map.removeLayer(l));
  }
  window._leaderLines = [];
  Object.keys(dots).forEach(k => delete dots[k]);

  const state = computeMarkerState(ch);

  // One persistent dot per unique anchor (not per character) — the dot IS
  // the location; a ribbon is just its label, fanned out for readability
  // when several characters share a spot. Every character's id maps into
  // `dots`, but characters sharing a location point at the SAME dot object.
  const dotByAnchorKey = {};

  Object.values(state).forEach(({c, pos, dead, missing, anchorPos, ribbonPos, needsLeader}) => {
      const anchorKey = anchorPos[0] + ',' + anchorPos[1];
      let dot = dotByAnchorKey[anchorKey];
      if(!dot){
        dot = L.circleMarker(anchorPos, {
          radius: 3,
          color: '#c8a850',
          fillColor: '#c8a850',
          fillOpacity: 1,
          weight: 1.5,
          interactive: false
        }).addTo(map);
        window._leaderLines.push(dot);
        dotByAnchorKey[anchorKey] = dot;
      }
      dots[c.id] = dot;

      const html = makeRibbonHTML(c.name, c.ink, dead, missing, c.textInk);
      // Must match charW/padding used inside makeRibbonHTML() above.
      const iconW = c.name.length * 9.5 + 52;
      const icon = L.divIcon({
        html,
        className: 'ribbon-label' + (c.id === debutRevealId ? ' debut-reveal' : ''),
        iconAnchor: [iconW / 2, 29]
      });

      const marker = L.marker(ribbonPos, {icon, interactive:true}).addTo(map);

      // Leader line from ribbon to the shared dot — only needed when the
      // ribbon is actually fanned out away from it (more than one
      // character at this location). A solo character's ribbon sits right
      // on top of its dot, so no line is needed.
      if(needsLeader){
        const lineColor = (dead || missing) ? '#666' : c.ink;
        const line = L.polyline([anchorPos, ribbonPos], {
          color: lineColor,
          weight: 1.5,
          opacity: 0.85,
          dashArray: '4, 3'
        }).addTo(map);
        window._leaderLines.push(line);
      }

      // Tooltip
      // The status suffix (e.g. "imprisoned", "King in the North") and the
      // note both describe what happens IN this position's chapter, so both
      // are gated by the same isRevealed check — place alone (the city name)
      // is never gated, since knowing which city a chapter opens in isn't a
      // spoiler the way what happens there is.
      let tipHtml = `<div class="tip-name">${c.name}</div>`;
      if(dead) tipHtml += `<div class="tip-dead">&#9760; Deceased — ${c.deathNote}</div>`;
      else if(missing) tipHtml += `<div class="tip-missing">&#63; Missing — ${c.deathNote}</div>`;
      else {
        const eventRevealed = isRevealed(pos.from, ch, curPhase);
        const placeLine = (eventRevealed && pos.status) ? `${pos.place} — ${pos.status}` : pos.place;
        tipHtml += `<div class="tip-place">${placeLine}</div>`;
        if(eventRevealed) tipHtml += `<div class="tip-note">${pos.note}</div>`;
      }

      marker.bindTooltip(tipHtml, {
        className: 'ribbon-tip',
        direction: 'top',
        offset: [0, -20],
        sticky: false
      });

      // Tooltips normally open on hover, but phones/tablets have no hover
      // state — so tapping a marker toggles its tooltip open/closed too.
      marker.on('click', function(e) {
        if (this.isTooltipOpen()) {
          this.closeTooltip();
        } else {
          closeAllTooltips();
          this.openTooltip();
        }
        L.DomEvent.stopPropagation(e);
      });

      markers[c.id] = marker;
  });
}

function getFanOffsets(count, anchorPos){
  // Returns ribbon positions stacked to the left, clamped between a min and
  // max screen-pixel distance so they stay close at all zoom levels.
  if(count === 1) return [anchorPos];

  const [lat, lng] = anchorPos;

  const zoom = map.getZoom();
  const scale = Math.pow(2, zoom);

  // Desired screen distances — clamped so they never get too far or too close
  const rawOffsetX = 160;          // ideal left offset in screen px
  const rawStepY   = 34;           // ideal vertical step in screen px (bumped up for larger banners)
  const minOffsetX = 60;           // never closer than this (px)
  const maxOffsetX = 120;          // never further than this (px)
  const minStepY   = 24;
  const maxStepY   = 36;

  const clamp = (val, mn, mx) => Math.min(mx, Math.max(mn, val));
  const screenOffsetX = clamp(rawOffsetX, minOffsetX, maxOffsetX);
  const screenStepY   = clamp(rawStepY,   minStepY,   maxStepY);

  // Convert clamped screen px → map units
  const mapOffsetLng = -(screenOffsetX / scale);
  const mapStepLat   =  (screenStepY   / scale);

  const totalHeight = (count - 1) * mapStepLat;
  const startLat = lat + totalHeight / 2;

  const offsets = [];
  for(let i = 0; i < count; i++){
    offsets.push([startLat - i * mapStepLat, lng + mapOffsetLng]);
  }
  return offsets;
}

// ─── PANELS ──────────────────────────────────────────────────────────────────

function buildCard(c, ch){
  const dead = isDeadAt(c, ch);
  const missing = isMissingAt(c, ch);
  const statusClass = dead ? 'status-dead' : missing ? 'status-missing' : 'status-alive';
  const statusLabel = dead ? 'Deceased' : missing ? 'Missing' : 'Active';
  const tierText = buildTierText(c, ch);
  const div = document.createElement('div');
  div.className = 'char-card';
  div.innerHTML = `
    <div class="char-card-header" onclick="toggleDetail(this)">
      <div class="char-swatch" style="background:${c.ink}"></div>
      <div style="flex:1">
        <div class="char-name">${c.name}</div>
        <div class="char-role">${c.house ? c.house + ' · ' : ''}${c.role}</div>
      </div>
      <span class="char-status ${statusClass}">${statusLabel}</span>
      <span class="char-expand">&#9660;</span>
    </div>
    <div class="char-detail">
      <div class="reveal-tier">${tierText || 'No information recorded yet.'}</div>
      ${dead ? `<div class="reveal-tier fate-note"><strong>Fate:</strong> ${c.deathNote}</div>` : ''}
      ${missing ? `<div class="reveal-tier missing-note"><strong>Last known:</strong> ${c.deathNote}</div>` : ''}
    </div>`;
  return div;
}

function toggleDetail(header){
  const detail = header.nextElementSibling;
  const arrow = header.querySelector('.char-expand');
  const open = detail.classList.contains('open');
  detail.classList.toggle('open');
  detail.style.display = open ? 'none' : 'block';
  if(arrow) arrow.textContent = open ? '▼' : '▲';
}

function openPanel(id){
  const overlay = document.getElementById('panelOverlay');
  const body = document.getElementById('panelBody');
  const titleEl = document.getElementById('panelTitle');

  openPanelId = id;
  overlay.classList.add('open');

  // Update filter button states
  ['side','glossary','deceased'].forEach(p => {
    const btn = document.getElementById('btn' + p[0].toUpperCase() + p.slice(1));
    if(btn) btn.classList.toggle('active', p === id);
  });

  body.innerHTML = '';

  if(id === 'side'){
    titleEl.textContent = 'Primary Characters';
    const vis = allChars.filter(c => c.isPov && isRevealed(c.firstChapter, curCh, curPhase));
    if(!vis.length){
      body.innerHTML = '<p class="empty-note">No POV characters introduced yet.</p>';
    } else {
      vis.forEach(c => body.appendChild(buildCard(c, curCh)));
    }
  } else if(id === 'glossary'){
    titleEl.textContent = 'Character Glossary';
    // Show a character from their sideChapter (first referenced) or firstChapter.
    // For POV chars not yet at their first POV chapter, render using sideTiers.
    const all = [...allChars].filter(c => {
      const introAt = (c.isPov && c.sideChapter) ? c.sideChapter : c.firstChapter;
      return isRevealed(introAt, curCh, curPhase);
    }).sort((a,b) => a.name.localeCompare(b.name));
    if(!all.length){
      body.innerHTML = '<p class="empty-note">No characters introduced yet.</p>';
    } else {
      all.forEach(c => {
        // Use side version for POV chars before their first POV chapter
        const useAsSide = c.isPov && c.sideChapter && !isRevealed(c.firstChapter, curCh, curPhase);
        if(useAsSide){
          const sideChar = Object.assign({}, c, {isPov:false, tiers:c.sideTiers});
          body.appendChild(buildCard(sideChar, curCh));
        } else {
          body.appendChild(buildCard(c, curCh));
        }
      });
    }
  } else if(id === 'deceased'){
    titleEl.textContent = 'Deceased & Missing';
    const rel = allChars.filter(c => isRevealed(c.firstChapter, curCh, curPhase) && c.deathChapter !== null && isRevealed(c.deathChapter, curCh, curPhase));
    if(!rel.length){
      body.innerHTML = '<p class="empty-note">No deaths or disappearances recorded yet.</p>';
    } else {
      rel.forEach(c => body.appendChild(buildCard(c, curCh)));
    }
  }
}

function closePanel(){
  document.getElementById('panelOverlay').classList.remove('open');
  ['side','glossary','deceased'].forEach(p => {
    const btn = document.getElementById('btn' + p[0].toUpperCase() + p.slice(1));
    if(btn) btn.classList.remove('active');
  });
  // Keep deceased filter button active state separate
  document.getElementById('btnDeceased').classList.toggle('active', showDeceased);
  openPanelId = null;
}

function toggleDeceased(){
  showDeceased = !showDeceased;
  document.getElementById('btnDeceased').classList.toggle('active', showDeceased);
  if(showDeceased && openPanelId !== 'side' && openPanelId !== 'glossary'){
    // don't auto-open panel, just update map
  }
  renderMarkers(curCh);
}

// ─── CHAPTER UPDATE ──────────────────────────────────────────────────────────

// Builds the always-visible recap line: "Opening"/"Finished" the chapter,
// plus what the reader currently knows about that chapter's POV character.
// Before N shows only their last confirmed place (a refresher, no spoilers
// from N). After N shows the note for N's events, once isRevealed says so.
function buildRecapHTML(ch, phase){
  const chObj = getChObj(ch);
  const tag = phase === 'after' ? 'Finished' : 'Opening';
  const povId = chapterPOV[ch];
  let body;
  if(!povId){
    body = phase === 'after' ? `The ${chObj.name} has ended.` : `About to begin the ${chObj.name}.`;
  } else {
    const povChar = allChars.find(c => c.id === povId);
    const pos = povChar ? getPos(povChar, ch) : null;
    if(!povChar){
      body = '';
    } else if(!pos && phase === 'before'){
      // Never been placed anywhere before, and the chapter hasn't happened
      // yet — nothing truthful to show. Stay silent rather than announce
      // "first appearance," which is itself a bit of a tell. Comes back
      // once the reader finishes the chapter and we have a real position.
      body = '';
    } else if(!pos){
      body = `<strong>${povChar.name}</strong> — first appearance.`;
    } else if(phase === 'before'){
      body = `<strong>${povChar.name}</strong> — last seen: ${pos.place}.`;
    } else {
      const eventRevealed = isRevealed(pos.from, ch, phase);
      body = `<strong>${povChar.name}</strong> — ${eventRevealed ? pos.note : 'no new developments recorded.'}`;
    }
  }
  return `<span class="recap-tag">${tag} · Ch. ${ch} — ${chObj.name}</span><span class="recap-sep">|</span>${body}`;
}

// Splits what used to be one setChapter() into three pieces so the animated
// advance (below) can reuse the UI/camera logic while taking manual control
// of marker rendering during the tween:
//   updateChapterUI() — text, buttons, recap panel, status bar (no map)
//   flyToCurrentPOV() — camera pan/zoom to the chapter's POV character
//   setChapter()      — the original instant path: UI + markers + camera
function updateChapterUI(){
  const chObj = getChObj(curCh);
  document.getElementById('chDisplay').innerHTML = `Ch. ${curCh} — <span>${chObj.name}</span>`;
  const idx = toIndex(curCh, curPhase);
  document.getElementById('prevBtn').disabled = idx <= MIN_STEP;
  document.getElementById('nextBtn').disabled = idx >= MAX_STEP;
  document.getElementById('jumpMenu').value = '';
  document.getElementById('recapPanel').innerHTML = buildRecapHTML(curCh, curPhase);

  if(openPanelId) openPanel(openPanelId);

  const deadCount = allChars.filter(c => isRevealed(c.firstChapter, curCh, curPhase) && c.deathChapter && isRevealed(c.deathChapter, curCh, curPhase)).length;
  const activeCount = allChars.filter(c => c.isPov && getPos(c, curCh)).length;
  const asOf = curPhase === 'after' ? 'through' : 'entering';
  document.getElementById('statusBar').textContent =
    `A Game of Thrones  ·  ${activeCount} POV character${activeCount !== 1 ? 's' : ''} active  ·  ${deadCount} death${deadCount !== 1 ? 's' : ''}/disappearance${deadCount !== 1 ? 's' : ''} recorded ${asOf} Chapter ${curCh}`;
}

function flyToCurrentPOV(){
  // Zoom to the POV character for this chapter (unless Free Look is on)
  const povId = chapterPOV[curCh];
  if(!povId || freeLook) return;
  const povChar = allChars.find(c => c.id === povId);
  if(!povChar) return;
  const pos = getPos(povChar, curCh);
  if(!pos) return;
  // Use the anchor position (not the ribbon offset)
  // Smooth pan/zoom to the character
  map.flyTo(pos.pos, getSnapZoom(), {
    animate: true,
    duration: 2.0,
    easeLinearity: 0.2
  });
}

// ─── First-POV Debut Reveal ────────────────────────────────────────────────
// A POV character's own first-ever chapter is treated as a spoiler-sensitive
// moment in its own right: on the OPENING of that chapter the map dims out
// and only their name appears — no marker, no location, nothing. On
// FINISHED, the map reappears already framed on their (now-confirmed)
// location and their banner reveals itself with a matching glow.
//
// `continuingPOV:true` on a character means they already had their own POV
// chapter in an earlier book — for them, this book's own `firstChapter` is
// just where the narration catches back up to them, not a series debut, so
// this treatment never applies and they render normally throughout.
function isDebutChar(c){ return !!c && c.isPov && c.continuingPOV !== true; }

// The character's very own debut position — the one entry whose "from"
// equals their firstChapter. Looked up directly rather than through
// getActiveArrival()/isRevealed(), since during the "opening" grey-out the
// normal reveal gate correctly returns null (nothing to show yet) — but we
// still need to know WHERE they'll turn out to be, purely to move the
// camera into place silently behind the dimmed map.
function getDebutArrival(c){
  if(!c || !c.positions) return null;
  return c.positions.find(p => isArrival(p) && p.from === c.firstChapter) || null;
}

// If `ch` is some character's own debut chapter, returns that character
// (regardless of phase — callers check curPhase separately). Otherwise null.
function debutCharForChapter(ch){
  const povId = chapterPOV[ch];
  if(!povId) return null;
  const c = allChars.find(x => x.id === povId);
  if(!c || !isDebutChar(c) || ch !== c.firstChapter) return null;
  return c;
}

function showDebutOverlay(name){
  const overlay = document.getElementById('debutOverlay');
  document.getElementById('debutName').textContent = name;
  document.getElementById('map').classList.add('debut-dimmed');
  overlay.classList.remove('revealing');
  overlay.classList.add('visible');
  void overlay.offsetWidth; // force reflow so the reveal animation restarts every time
  overlay.classList.add('revealing');
}

function hideDebutOverlay(){
  const overlay = document.getElementById('debutOverlay');
  overlay.classList.remove('visible', 'revealing');
  document.getElementById('map').classList.remove('debut-dimmed');
}

// Every chapter-navigation path (Next, Prev, dropdown jump, and the end of
// any marker-movement tween) ends up here once curCh/curPhase are already
// set — this used to just be "renderMarkers(curCh); flyToCurrentPOV();"
// inline at each call site; centralizing it is what lets the debut-reveal
// check live in exactly one place instead of three.
function renderChapterMap(){
  const debutChar = debutCharForChapter(curCh);

  if(debutChar && curPhase === 'before'){
    // Nothing should be visible yet — clear every marker/dot/line off the
    // map, then silently move the camera to where the character will
    // actually turn out to be, entirely behind the dimmed overlay, so the
    // reveal doesn't also involve a visible pan once it lifts.
    Object.values(markers).forEach(m => map.removeLayer(m));
    Object.keys(markers).forEach(k => delete markers[k]);
    if(window._leaderLines) window._leaderLines.forEach(l => map.removeLayer(l));
    window._leaderLines = [];
    Object.keys(dots).forEach(k => delete dots[k]);

    const resolved = resolvePos(getDebutArrival(debutChar));
    if(resolved && !freeLook) map.setView(resolved.pos, getSnapZoom(), {animate:false});

    showDebutOverlay(debutChar.name);
    return;
  }

  hideDebutOverlay();
  renderMarkers(curCh, (debutChar && curPhase === 'after') ? debutChar.id : null);
  flyToCurrentPOV();
}

function setChapter(n, phase){
  curCh = Math.max(0, Math.min(72, n));
  curPhase = (phase === 'after') ? 'after' : 'before';
  updateChapterUI();
  renderChapterMap();
}

// ─── MARKER MOVEMENT ANIMATION ────────────────────────────────────────────
// Only used for single-step forward reading (the Next button). Jumps via
// the chapter dropdown and stepping backward (Prev) stay instant — walking
// a character backward through the story reads oddly, and an arbitrary
// jump has no continuous "story" to animate through.
//
// Same duration/easing family as flyToCurrentPOV()'s map pan, so the camera
// and the character arrive together.
// Session 15 fix: duration is now paced by distance, not a flat value — a
// character crossing the whole map takes noticeably longer than one moving
// to an adjacent location. Clamped so short hops don't feel instant and
// very long journeys (Winterfell to the Dothraki Sea) don't drag forever.
const MOVE_SPEED_UNITS_PER_MS = 0.5;   // ~500 map units/second
const MOVE_MIN_DURATION_MS = 900;
const MOVE_MAX_DURATION_MS = 6000;
function durationForDistance(totalLength){
  return Math.max(MOVE_MIN_DURATION_MS, Math.min(MOVE_MAX_DURATION_MS, totalLength / MOVE_SPEED_UNITS_PER_MS));
}
function easeInOutQuad(t){ return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; }

// Turns the chain of transit legs between two arrivals into an ordered list
// of {kind, length, ...} segments the animation can walk at constant speed.
// Each segment is either "road" (follows a named road's real waypoints
// between two pct values) or "straight" (a fallback line between two
// points — used across different roads, fixed points, or an UNTRACED
// custom route that hasn't been walked with the Route Tracer yet).
function buildFlightPath(c, prevArrival, nextArrival){
  // If this arrival has a real traced route (from the 🧭 Untraced Routes
  // dev tool), use it verbatim as one continuous path instead of the
  // straight-line/transit-chain approximation below — same idea as a named
  // road, but a one-off path specific to this character's journey.
  if(nextArrival.route && nextArrival.route.length > 1){
    const pts = nextArrival.route;
    const dists = [0];
    for(let i=1;i<pts.length;i++){
      const dLat = pts[i][0]-pts[i-1][0], dLng = pts[i][1]-pts[i-1][1];
      dists.push(dists[i-1] + Math.sqrt(dLat*dLat+dLng*dLng));
    }
    const legs = [];
    for(let i=0;i<pts.length-1;i++){
      legs.push({ kind:'straight', fromPos:pts[i], toPos:pts[i+1], length: dists[i+1]-dists[i] });
    }
    return legs;
  }

  const chain = getTransitChain(c, prevArrival, nextArrival);
  const rawStops = [prevArrival, ...chain, nextArrival];
  const stops = rawStops.map(entry => {
    const resolved = resolvePos(entry);
    if(!resolved) return null;
    return { pos: resolved.pos, road: entry.road || null, pct: entry.road ? entry.pct : null };
  }).filter(Boolean);

  const legs = [];
  for(let i = 0; i < stops.length - 1; i++){
    const A = stops[i], B = stops[i+1];
    if(A.road && B.road && A.road === B.road){
      const distA = roadDistanceAt(A.road, A.pct), distB = roadDistanceAt(B.road, B.pct);
      legs.push({ kind:'road', roadId:A.road, distA, distB, length: Math.abs(distB - distA) });
    } else {
      const dLat = B.pos[0]-A.pos[0], dLng = B.pos[1]-A.pos[1];
      legs.push({ kind:'straight', fromPos:A.pos, toPos:B.pos, length: Math.sqrt(dLat*dLat + dLng*dLng) });
    }
  }
  return legs;
}

// Position along a multi-leg path at a given cumulative distance (0..total).
function posAlongFlightPath(legs, totalLength, targetDist){
  let acc = 0;
  for(let i = 0; i < legs.length; i++){
    const leg = legs[i];
    const legLen = leg.length || 0;
    const isLast = i === legs.length - 1;
    if(acc + legLen >= targetDist || isLast){
      const t = legLen > 0 ? Math.max(0, Math.min(1, (targetDist - acc) / legLen)) : 1;
      if(leg.kind === 'road') return roadPosAtDistance(leg.roadId, leg.distA + t * (leg.distB - leg.distA));
      return [ leg.fromPos[0] + t*(leg.toPos[0]-leg.fromPos[0]), leg.fromPos[1] + t*(leg.toPos[1]-leg.fromPos[1]) ];
    }
    acc += legLen;
  }
  return null;
}

function advanceChapterAnimated(newCh, newPhase){
  // Snapshot the OLD state before touching curCh/curPhase — computeMarkerState()
  // reads both globally, same as getPos()/isRevealed() do everywhere else.
  const prevState = computeMarkerState(curCh);

  curCh = newCh;
  curPhase = (newPhase === 'after') ? 'after' : 'before';
  updateChapterUI();

  const newState = computeMarkerState(curCh);

  // A "mover" is a character present both before and after this step whose
  // true location (anchorPos) actually changed — not just their fanned-out
  // ribbon offset, which can shift slightly if someone else joins or leaves
  // their location without them moving at all.
  const movers = [];
  Object.keys(newState).forEach(id => {
    const prev = prevState[id];
    const next = newState[id];
    if(!prev) return; // wasn't on the map before (first appearance) — no walk-in, just render normally
    if(prev.anchorPos[0] === next.anchorPos[0] && prev.anchorPos[1] === next.anchorPos[1]) return;
    movers.push({id, prev, next});
  });

  if(movers.length === 0){
    // Nothing is actually walking this step — render and pan exactly as
    // the plain instant path does (including the debut-reveal check).
    renderChapterMap();
    return;
  }

  // Something IS walking. Deliberately do NOT call renderMarkers() yet —
  // every marker, leader line, and anchor dot currently on screen is left
  // exactly as-is for the duration of the tween(s). Only the movers' own
  // markers are touched, right up until the final batch finishes.
  animating = true;

  // Session 14: characters heading to the SAME destination (travelling
  // together) animate simultaneously; characters heading to DIFFERENT
  // destinations in the same step animate one batch after another, not
  // all at once. Batches are ordered book-order where determinable —
  // in practice that means the chapter's own POV character's batch goes
  // first, since that's the one thing we can always tell from the data;
  // any remaining batches follow in the order they were found.
  const povId = chapterPOV[curCh];
  const batchMap = {};
  movers.forEach(m => {
    const key = m.next.anchorPos[0] + ',' + m.next.anchorPos[1];
    (batchMap[key] = batchMap[key] || []).push(m);
  });
  const batches = Object.values(batchMap).sort((a, b) => {
    const aFirst = a.some(m => m.id === povId) ? 0 : 1;
    const bFirst = b.some(m => m.id === povId) ? 0 : 1;
    return aFirst - bFirst;
  });

  const allMoverIds = new Set(movers.map(m => m.id));
  runMoveBatch(batches, 0, allMoverIds);
}

function runMoveBatch(batches, idx, allMoverIds){
  if(idx >= batches.length){
    animating = false;
    // Final reconciliation pass — this is the ONE moment everything (fan
    // positions, leader lines, dots, tooltips, any newly revealed or
    // departed characters) snaps to its exact correct state, now that
    // every batch has actually arrived. Also where the debut-reveal check
    // runs, same as the plain instant path.
    renderChapterMap();
    return;
  }

  const batch = batches[idx];
  const povId = chapterPOV[curCh];
  const primaryMoverId = (povId && batch.some(m => m.id === povId)) ? povId : batch[0].id;
  const followCamera = !freeLook;
  const zoomAtStart = map.getZoom();
  const startTime = performance.now();
  let pending = batch.length;

  const advance = () => { pending--; if(pending <= 0) runMoveBatch(batches, idx + 1, allMoverIds); };

  // Companions travelling together share one location dot, animated once
  // per starting point rather than once per character. If someone who
  // ISN'T moving this step remains behind at that same spot, the existing
  // dot stays put for them and a fresh one is created for the travellers;
  // otherwise (nobody left behind) the existing dot is reused directly and
  // simply moves — no duplicate ever appears.
  const startClusters = {};
  batch.forEach(m => {
    const key = m.prev.anchorPos[0] + ',' + m.prev.anchorPos[1];
    (startClusters[key] = startClusters[key] || []).push(m);
  });
  const travelDots = {};
  Object.entries(startClusters).forEach(([startKey, clusterMovers]) => {
    const anyId = clusterMovers[0].id;
    const existingDot = dots[anyId];
    let stayerRemains = false;
    Object.keys(dots).forEach(otherId => {
      if(dots[otherId] === existingDot && !allMoverIds.has(otherId)) stayerRemains = true;
    });
    if(existingDot && !stayerRemains){
      travelDots[startKey] = existingDot; // reuse in place, nothing left behind to keep it there
    } else {
      const startPos = clusterMovers[0].prev.anchorPos;
      const freshDot = L.circleMarker(startPos, {
        radius: 3, color: '#c8a850', fillColor: '#c8a850',
        fillOpacity: 1, weight: 1.5, interactive: false
      }).addTo(map);
      window._leaderLines.push(freshDot);
      travelDots[startKey] = freshDot;
    }
  });

  batch.forEach(({id, prev, next}) => {
    const marker = markers[id];
    if(!marker){ advance(); return; }

    // No snap-back needed — this marker is already sitting at its old
    // ribbon position, since nothing above touched it.
    const fromRibbon = prev.ribbonPos, toRibbon = next.ribbonPos;
    const startKey = prev.anchorPos[0] + ',' + prev.anchorPos[1];
    const travelDot = travelDots[startKey];

    // The full route since the last arrival, however many now-finished
    // chapters it was spread across — walked here as one continuous
    // flight, following any named roads it passes through along the way.
    const legs = buildFlightPath(prev.c, prev.rawEntry, next.rawEntry);
    const totalLength = legs.reduce((sum, leg) => sum + (leg.length || 0), 0) || 1;
    // Session 15 fix: duration now scales with the real distance travelled
    // instead of a flat 2s for every hop, long or short.
    const duration = durationForDistance(totalLength);

    function frame(now){
      const t = Math.min(1, (now - startTime) / duration);
      const e = easeInOutQuad(t);
      const anchorNow = posAlongFlightPath(legs, totalLength, e * totalLength) || next.anchorPos;

      // Carry the fan-offset interpolation on top of the anchor's position
      // along the route, same as before, so grouped characters still land
      // in their correct fanned spot at the end.
      const offFromLat = fromRibbon[0] - prev.anchorPos[0], offFromLng = fromRibbon[1] - prev.anchorPos[1];
      const offToLat   = toRibbon[0]   - next.anchorPos[0], offToLng   = toRibbon[1]   - next.anchorPos[1];
      const ribbonPosNow = [
        anchorNow[0] + offFromLat + e * (offToLat - offFromLat),
        anchorNow[1] + offFromLng + e * (offToLng - offFromLng)
      ];
      marker.setLatLng(ribbonPosNow);
      // The dot IS the character's true location — it moves in lockstep
      // with the anchor (never removed/recreated mid-flight), while the
      // ribbon is just its label and can lag/fan for readability.
      if(travelDot) travelDot.setLatLng(anchorNow);

      // Camera tracks the true anchor position (not the cosmetic fan
      // offset) of whichever mover is "primary" for THIS batch, every
      // frame — a real follow along the whole route, not a separate flyTo
      // racing the marker to the endpoint.
      if(followCamera && id === primaryMoverId){
        map.setView(anchorNow, zoomAtStart, {animate:false});
      }

      if(t < 1){
        requestAnimationFrame(frame);
      } else {
        advance();
      }
    }
    requestAnimationFrame(frame);
  });
}



// ─── INIT ─────────────────────────────────────────────────────────────────────
// Re-render on zoom so leader line offsets stay proportional
map.on('zoomend', function(){ renderMarkers(curCh); });

setChapter(0, 'before');
</script>
