<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Game of Thrones — Reading Companion</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #1a1208;
    color: #e8dbb8;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #header {
    background: #0d0a04;
    border-bottom: 1px solid #5a3e1a;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  #title {
    font-size: 18px;
    color: #c8a850;
    letter-spacing: 2px;
    font-variant: small-caps;
    white-space: nowrap;
  }

  #homeLink {
    font-size: 14px;
    color: #8a7040;
    text-decoration: none;
    margin-right: 4px;
    transition: color 0.15s;
  }
  #homeLink:hover { color: #c8a850; }

  .nav-btn {
    width: 32px; height: 32px;
    border-radius: 6px;
    border: 1px solid #5a3e1a;
    background: #1a1208;
    color: #c8a850;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.12s;
    flex-shrink: 0;
  }
  .nav-btn:hover { background: #2a1e08; border-color: #8a6030; }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }

  #chDisplay {
    font-size: 13px;
    color: #c8a850;
    white-space: nowrap;
    min-width: 180px;
    font-family: Georgia, serif;
  }
  #chDisplay span { color: #8a7040; font-size: 12px; }

  #jumpMenu, #bookMenu {
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px solid #5a3e1a;
    background: #1a1208;
    color: #c8a850;
    cursor: pointer;
    max-width: 200px;
    font-family: Georgia, serif;
  }

  .filter-btn {
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid #5a3e1a;
    background: #1a1208;
    color: #8a7040;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    font-family: Georgia, serif;
  }
  .filter-btn.active { background: #2a1e08; color: #c8a850; border-color: #8a6030; }
  .filter-btn:hover { background: #2a1e08; color: #c8a850; }

  #recapPanel {
    background: #140f06;
    border-bottom: 1px solid #3a2a0a;
    padding: 8px 16px;
    font-size: 13px;
    color: #b89a54;
    font-family: Georgia, serif;
    line-height: 1.5;
    flex-shrink: 0;
  }
  #recapPanel .recap-tag {
    color: #c8a850;
    font-variant: small-caps;
    letter-spacing: 0.5px;
  }
  #recapPanel .recap-sep { color: #4a3a18; margin: 0 8px; }
  #recapPanel strong { color: #e8dbb8; font-weight: normal; }

  #mapWrap {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
  }

  #map {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    background: #1a2a3a;
  }

  /* ── Chapter Reveal ───────────────────────────────────────────────────── */
  /* Every chapter opens the way the books themselves do: before anything
     else, a name-only heading. The map itself dims/desaturates under the
     overlay rather than being replaced by a solid block, so there's a faint
     sense of "the world is still there, just not in focus yet" underneath. */
  #map.map-dimmed {
    filter: grayscale(0.9) brightness(0.32) contrast(1.05);
    transition: filter 1.1s ease;
  }
  #map { transition: filter 0.6s ease; }

  #chapterRevealOverlay {
    position: absolute;
    inset: 0;
    z-index: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, rgba(10,7,3,0.35) 0%, rgba(6,4,2,0.72) 65%, rgba(4,3,1,0.85) 100%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.9s ease;
  }
  #chapterRevealOverlay.visible { opacity: 1; pointer-events: auto; }

  #chapterRevealName {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(2.2rem, 6vw, 4.2rem);
    font-variant: small-caps;
    letter-spacing: 0.28em;
    padding-left: 0.28em; /* compensate for the trailing letter-spacing gap */
    color: #f0d488;
    background: linear-gradient(100deg, #b9863a 0%, #f5deA0 45%, #e8c878 55%, #b9863a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    clip-path: inset(0 100% 0 0);
    text-shadow: 0 0 0 rgba(240, 212, 136, 0);
  }
  #chapterRevealOverlay.revealing #chapterRevealName {
    animation: chapterNameReveal 2.3s cubic-bezier(.32,.02,.18,1) forwards;
  }
  @keyframes chapterNameReveal {
    0%   { clip-path: inset(0 100% 0 0); text-shadow: 0 0 0 rgba(240,212,136,0); }
    55%  { text-shadow: 0 0 22px rgba(240,212,136,0.85); }
    85%  { clip-path: inset(0 0 0 0); text-shadow: 0 0 22px rgba(240,212,136,0.7); }
    100% { clip-path: inset(0 0 0 0); text-shadow: 0 0 8px rgba(240,212,136,0.35); }
  }

  /* Persistent glow on the current chapter's own POV banner. Fades in the
     moment the reveal lifts (same feel as before), but now HOLDS a soft
     standing glow at the end (100%) instead of fading back to nothing, so
     it stays lit for as long as the reader remains on this chapter — through
     zooming, panning, or any other re-render. Opacity/drop-shadow only,
     never transform, so it can't fight Leaflet's own positioning transform
     on the marker. */
  .ribbon-label.banner-glow svg {
    animation: bannerGlowIn 1.3s ease-out forwards;
  }
  /* Settled end-state of bannerGlowIn (its 100% keyframe), applied directly
     with no animation. Used for every re-render of an already-revealed
     glow banner (travel-animation frames, zoom, redundant "settle" renders)
     so the banner just stays lit instead of restarting the fade-in from
     0% opacity each time — renderMarkers() rebuilds marker DOM from scratch
     on every call, so re-adding the animated class every time would replay
     the flash-then-glow every single call, not just the first. */
  .ribbon-label.banner-glow-static svg {
    opacity: 1;
    filter: drop-shadow(0 0 7px rgba(240,212,136,0.6));
  }
  @keyframes bannerGlowIn {
    0%   { opacity: 0; filter: drop-shadow(0 0 0 rgba(240,212,136,0)); }
    50%  { opacity: 1; filter: drop-shadow(0 0 14px rgba(240,212,136,0.9)); }
    100% { opacity: 1; filter: drop-shadow(0 0 7px rgba(240,212,136,0.6)); }
  }

  .leaflet-control-zoom a {
    background: #1a1208 !important;
    color: #c8a850 !important;
    border-color: #5a3e1a !important;
    font-family: Georgia, serif;
  }
  .leaflet-control-zoom a:hover { background: #2a1e08 !important; }

  /* Custom ribbon marker styles */
  .ribbon-label {
    background: none !important;
    border: none !important;
  }

  /* Panel overlay */
  #panelOverlay {
    position: fixed;
    top: 60px; right: 0;
    width: 340px;
    max-height: calc(100vh - 70px);
    background: #0d0a04;
    border-left: 1px solid #5a3e1a;
    border-bottom: 1px solid #5a3e1a;
    display: none;
    flex-direction: column;
    z-index: 1000;
    font-family: Georgia, serif;
  }
  #panelOverlay.open { display: flex; }
  #panelHeader {
    padding: 10px 14px;
    background: #1a1208;
    border-bottom: 1px solid #5a3e1a;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    color: #c8a850;
    letter-spacing: 1px;
    font-variant: small-caps;
    flex-shrink: 0;
  }
  #panelClose {
    cursor: pointer;
    font-size: 18px;
    color: #8a7040;
    line-height: 1;
  }
  #panelClose:hover { color: #c8a850; }
  #panelBody {
    overflow-y: auto;
    flex: 1;
    padding: 12px;
  }

  .char-card {
    border: 1px solid #3a2a0a;
    border-radius: 6px;
    margin-bottom: 8px;
    overflow: hidden;
    background: #120e04;
  }
  .char-card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .char-card-header:hover { background: #1a1208; }
  .char-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .char-name { font-size: 13px; color: #c8a850; flex: 1; }
  .char-role { font-size: 11px; color: #6a5030; }
  .char-status {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 10px;
    white-space: nowrap;
  }
  .status-dead { background: #3a1010; color: #c05050; }
  .status-missing { background: #2a2a10; color: #a09050; }
  .status-alive { background: #0a2010; color: #50a050; }
  .char-expand { font-size: 11px; color: #6a5030; margin-left: 4px; }
  .char-detail {
    padding: 10px 12px;
    border-top: 1px solid #2a1a0a;
    background: #0a0804;
    font-size: 12px;
    color: #8a7a50;
    line-height: 1.7;
    display: none;
  }
  .char-detail.open { display: block; }
  .char-detail strong { color: #c8a850; font-weight: normal; }
  .reveal-tier { margin-bottom: 6px; }
  .reveal-tier + .reveal-tier {
    border-top: 1px dashed #2a1a0a;
    padding-top: 6px;
    margin-top: 2px;
  }
  .fate-note { color: #c05050 !important; margin-top: 6px; }
  .missing-note { color: #a09050 !important; margin-top: 6px; }

  #statusBar {
    background: #0d0a04;
    border-top: 1px solid #3a2a0a;
    padding: 5px 16px;
    font-size: 11px;
    color: #5a4a20;
    font-family: Georgia, serif;
    font-style: italic;
    flex-shrink: 0;
  }

  /* Tooltip */
  .leaflet-tooltip.ribbon-tip {
    background: #0d0a04;
    border: 1px solid #5a3e1a;
    color: #c8a850;
    font-family: Georgia, serif;
    font-size: 12px;
    line-height: 1.6;
    padding: 8px 12px;
    border-radius: 6px;
    max-width: 220px;
    width: 220px;
    white-space: normal;
    word-wrap: break-word;
    box-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  .leaflet-tooltip.ribbon-tip::before { display: none; }

  .tip-name { font-size: 13px; color: #c8a850; font-variant: small-caps; letter-spacing: 1px; }
  .tip-dead { color: #c05050; font-size: 11px; margin-top: 2px; }
  .tip-missing { color: #a09050; font-size: 11px; margin-top: 2px; }
  .tip-place { color: #8a7040; font-size: 11px; margin-top: 2px; }
  .tip-note { color: #a09060; font-size: 11px; margin-top: 2px; }

  .empty-note {
    font-size: 13px;
    color: #5a4a20;
    font-style: italic;
    padding: 8px 0;
    font-family: Georgia, serif;
  }

  /* ── Mobile ── */
  @media (max-width: 700px) {
    #header {
      padding: 8px 10px;
      gap: 8px;
    }
    #title {
      font-size: 14px;
      letter-spacing: 1px;
    }
    .nav-btn {
      width: 40px;
      height: 40px;
      font-size: 18px;
    }
    #chDisplay {
      font-size: 12px;
      min-width: 0;
    }
    #jumpMenu, #bookMenu {
      max-width: 140px;
      font-size: 12px;
      padding: 8px 6px;
    }
    .filter-btn {
      font-size: 12px;
      padding: 9px 12px;
    }
    /* Full-screen panel overlay on small screens */
    #panelOverlay {
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 100vh;
      max-height: 100vh;
      border-left: none;
    }
    /* Wider, more finger-friendly tooltips */
    .leaflet-tooltip.ribbon-tip {
      max-width: 220px;
      font-size: 13px;
    }
    #recapPanel {
      font-size: 12px;
      padding: 7px 10px;
    }
  }
</style>
</head>
<body>

<div id="header">
  <a id="homeLink" href="index.html" title="Back to series selection">‹</a>
  <div id="title">Loading…</div>
  <select id="bookMenu" onchange="if(this.value) window.location.href = 'companion.html?book=' + this.value;" title="Switch book">
    <option value="agot">A Game of Thrones</option>
    <option value="acok">A Clash of Kings</option>
  </select>
  <button class="nav-btn" id="prevBtn" onclick="stepCh(-1)" title="Previous chapter" disabled>←</button>
  <button class="nav-btn" id="nextBtn" onclick="stepCh(1)" title="Next chapter">→</button>
  <div id="chDisplay">Ch. 0 — <span>Prologue</span></div>
  <select id="jumpMenu" onchange="jumpTo(this.value)">
    <option value="">Jump to chapter...</option>
  </select>
  <button class="filter-btn active" id="btnDeceased" onclick="toggleDeceased()">☠ Deceased</button>
  <button class="filter-btn" id="btnSide" onclick="openPanel(&#39;side&#39;)">Primary Characters</button>
  <button class="filter-btn" id="btnGlossary" onclick="openPanel(&#39;glossary&#39;)">Glossary</button>
  <button class="filter-btn" id="btnFreeLook" onclick="toggleFreeLook()" title="Free Look — map stays where you left it when advancing chapters">🔭 Free Look</button>
  <div id="devTools" style="margin-left:auto;display:none;gap:6px;">
    <button class="filter-btn" id="btnCalibrate" onclick="toggleCalibrateMode()" title="Click anywhere on map to get px() coordinates">📍 Calibrate</button>
    <button class="filter-btn" id="btnTrace" onclick="openTraceModal()" title="Trace road paths for automatic character positioning">✏️ Trace Road</button>
    <button class="filter-btn" id="btnUntraced" onclick="openUntracedModal()" title="List character journeys still using a rough straight-line path">🧭 Untraced Routes</button>
  </div>
</div>

<div id="recapPanel"></div>

<div id="mapWrap">
  <div id="map"></div>
  <div id="chapterRevealOverlay"><div id="chapterRevealName"></div></div>
</div>

<div id="panelOverlay">
  <div id="panelHeader">
    <span id="panelTitle">Glossary</span>
    <span id="panelClose" onclick="closePanel()">×</span>
  </div>
  <div id="panelBody"></div>
</div>

<div id="statusBar">A Game of Thrones  ·  0 POV characters active  ·  0 deaths/disappearances recorded through Chapter 0</div>

<script>
// ─── DEV MODE ──────────────────────────────────────────────────────────────
// The Calibrate / Trace Road / Free Look buttons are author-only tools.
// They stay hidden on the live site unless the page is loaded with ?dev=true
// in the URL, e.g. AGOT_Reading_Companion.html?dev=true
const DEV_MODE = new URLSearchParams(window.location.search).get('dev') === 'true';
if (DEV_MODE) {
  document.getElementById('devTools').style.display = 'flex';
}

// ─── DATA ────────────────────────────────────────────────────────────────────

let allChapters = [];

// Coordinates recalibrated for OfficialGOTMap.jpg (7400×4932):
// Winterfell:     px(1154, 1220)
// Castle Black:   px(1368, 746)
// King's Landing: px(1394, 2516)
// Pentos:         px(2113, 2488)
// Vaes Dothrak:   px(4719, 2315)
// The Eyrie:      px(1486, 2033)
// Riverrun:       px(1055, 2180)
// The Twins:      px(1117, 1923)
// Harrenhal:      px(1294, 2252)
// Moat Cailin:    px(1159, 1593)
const IMG_W = 7400, IMG_H = 4932;
function px(x, y){ return [IMG_H - y, x]; }

let allChars = [];

// ─── MAP SETUP ───────────────────────────────────────────────────────────────

const bounds = [[0, 0], [IMG_H, IMG_W]];

const map = L.map('map', {
  crs: L.CRS.Simple,
  minZoom: -2,
  maxZoom: 4,
  zoomSnap: 0.25,
  zoomDelta: 0.5,
  attributionControl: false,
  maxBounds: bounds,
  maxBoundsViscosity: 1.0
});

L.imageOverlay('OfficialGOTMap.jpg', bounds).addTo(map);
map.fitBounds(bounds);
map.setMaxBounds(bounds);

// ─── ROAD NETWORK ────────────────────────────────────────────────────────────
// Roads are defined as arrays of [lat, lng] waypoints (Leaflet coordinate space).
// px(x,y) → [IMG_H - y, x] so a road waypoint is just px(x,y) directly.
// Characters on a road use: { road:"kingsroad", pct:0.0–1.0 }
// pct=0 is the FIRST waypoint in the array, pct=1 is the LAST.
// Named stops let you say pct:"winterfell" instead of a number.
//
// To add or update a road, use Road Tracing Mode (button in header).
// The tracer outputs a ready-to-paste waypoints array.

let roads = {};

// Interpolate a position along a road's waypoints at a given percentage (0–1).
// Returns a Leaflet [lat, lng] coordinate, or null if the road has no waypoints yet.
function getRoadPos(roadId, pct) {
  const road = roads[roadId];
  if (!road || !road.waypoints || road.waypoints.length < 2) return null;

  // Resolve named stop to a number
  if (typeof pct === 'string') {
    const named = road.stops[pct.toLowerCase()];
    if (named === undefined) { console.warn('Unknown stop:', pct); return null; }
    pct = named;
  }

  pct = Math.max(0, Math.min(1, pct));

  const total = roadTotalLength(roadId);
  return roadPosAtDistance(roadId, pct * total);
}

// Cached cumulative-distance arrays per road, so the animation loop (which
// calls roadPosAtDistance() on every frame) doesn't rebuild this every time.
const _roadDistCache = {};
function roadDistances(roadId){
  if(_roadDistCache[roadId]) return _roadDistCache[roadId];
  const pts = roads[roadId].waypoints;
  const dists = [0];
  for (let i = 1; i < pts.length; i++) {
    const dlat = pts[i][0] - pts[i-1][0];
    const dlng = pts[i][1] - pts[i-1][1];
    dists.push(dists[i-1] + Math.sqrt(dlat*dlat + dlng*dlng));
  }
  _roadDistCache[roadId] = dists;
  return dists;
}
function roadTotalLength(roadId){
  const dists = roadDistances(roadId);
  return dists[dists.length - 1];
}
// Absolute distance (not 0–1 pct) along the road for a given pct/named stop —
// used so the movement animation can tween in distance-space between two
// pct values while still following the actual waypoints, not a straight line.
function roadDistanceAt(roadId, pct){
  const road = roads[roadId];
  if(!road) return 0;
  if (typeof pct === 'string') {
    const named = road.stops[pct.toLowerCase()];
    if (named === undefined) return 0;
    pct = named;
  }
  pct = Math.max(0, Math.min(1, pct));
  return pct * roadTotalLength(roadId);
}
// Find the [lat,lng] at an absolute distance along a road's waypoints.
function roadPosAtDistance(roadId, dist){
  const pts = roads[roadId].waypoints;
  const dists = roadDistances(roadId);
  const total = dists[dists.length - 1];
  const target = Math.max(0, Math.min(total, dist));

  for (let i = 1; i < pts.length; i++) {
    if (dists[i] >= target) {
      const segLen = dists[i] - dists[i-1];
      const t = segLen > 0 ? (target - dists[i-1]) / segLen : 0;
      return [
        pts[i-1][0] + t * (pts[i][0] - pts[i-1][0]),
        pts[i-1][1] + t * (pts[i][1] - pts[i-1][1])
      ];
    }
  }
  return pts[pts.length - 1];
}

// ─── COORDINATE PICKER & ROAD TRACER ─────────────────────────────────────────
// MODE: 'off' | 'calibrate' | 'trace'
let toolMode = 'off';
let traceRoadId = null;
let traceWaypoints = [];  // accumulated [lat,lng] points for current trace session
let tracePolyline = null; // live preview polyline on the map
let traceMarkers  = [];   // small dot markers at each clicked point

// ── Coord display box (shared by both modes) ──
const coordBox = document.createElement('div');
coordBox.style.cssText = `
  position:fixed; bottom:40px; left:50%; transform:translateX(-50%);
  background:#0d0a04; border:1px solid #5a3e1a; color:#c8a850;
  padding:8px 16px; border-radius:6px; font-family:Georgia,serif;
  font-size:13px; z-index:2000; display:none; pointer-events:none;
  letter-spacing:0.5px;
`;
document.body.appendChild(coordBox);

// ── Banner (shown during active modes) ──
const modeBanner = document.createElement('div');
modeBanner.style.cssText = `
  position:fixed; top:60px; left:50%; transform:translateX(-50%);
  background:#2a1a00; border:1px solid #8a6030; color:#c8a850;
  padding:6px 16px; border-radius:6px; font-family:Georgia,serif;
  font-size:12px; z-index:2000; pointer-events:none; letter-spacing:0.5px;
  display:none;
`;
document.body.appendChild(modeBanner);

// ── Road Tracing Panel ──
const tracePanel = document.createElement('div');
tracePanel.style.cssText = `
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  background:#0d0a04; border:1px solid #5a3e1a; border-bottom:none;
  color:#c8a850; padding:10px 16px; border-radius:8px 8px 0 0;
  font-family:Georgia,serif; font-size:12px; z-index:2000;
  display:none; flex-direction:column; gap:8px; min-width:420px;
  box-shadow:0 -2px 12px rgba(0,0,0,0.5);
`;
tracePanel.innerHTML = `
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
    <span id="tracePanelTitle" style="color:#c8a850;font-variant:small-caps;letter-spacing:1px;font-size:13px;">Road Tracing Mode</span>
    <div style="display:flex;gap:8px;align-items:center;">
      <span id="traceCount" style="color:#8a7040;font-size:11px;">0 points</span>
      <button id="traceUndoBtn" onclick="traceUndo()" style="padding:3px 10px;background:#1a1208;border:1px solid #5a3e1a;color:#c8a850;border-radius:4px;cursor:pointer;font-family:Georgia,serif;font-size:11px;">↩ Undo</button>

function traceFinish() {
  if (traceWaypoints.length < 2) {
    alert('Please click at least 2 points along the route before finishing.');
    return;
  }

  if (traceCustomTarget) {
    // Custom character route (from the 🧭 Untraced Routes tool) — write
    // straight onto that arrival's own `route` field, live, so it's
    // immediately usable, and also print paste-ready output for saving it
    // back into the actual character data in the code.
    traceCustomTarget.nextArrival.route = traceWaypoints.slice();

    const waypointStr = traceWaypoints.map(([lat,lng]) =>
      `    [${Math.round(lat)}, ${Math.round(lng)}]`
    ).join(',\n');
    const output = `// Paste this "route" field onto ${traceCustomTarget.charName}'s arrival entry\n// (place: "${traceCustomTarget.toPlace}") in the code:\nroute: [\n${waypointStr}\n],`;

    const outEl = tracePanel.querySelector('#traceOutput');
    outEl.textContent = output;
    outEl.style.display = 'block';
    navigator.clipboard.writeText(output).catch(()=>{});

    modeBanner.textContent = `✓ ${traceCustomTarget.charName}'s route to ${traceCustomTarget.toPlace} traced (${traceWaypoints.length} points) — copied to clipboard! Active for this session; paste into the code to keep it.`;

    traceMarkers.forEach(m => map.removeLayer(m));
    traceMarkers = [];
    if (tracePolyline) { map.removeLayer(tracePolyline); tracePolyline = null; }

    const finishedLine = L.polyline(traceCustomTarget.nextArrival.route, {
      color: '#f0c040', weight: 2, opacity: 0.5
    }).addTo(map);
    window._roadLines = window._roadLines || [];
    window._roadLines.push(finishedLine);

    toolMode = 'off';
    map.getContainer().style.cursor = '';
    tracePanel.querySelector('#traceCount').textContent = traceWaypoints.length + ' points ✓';
    traceCustomTarget = null;
    renderMarkers(curCh, currentGlowId);
    return;
  }

  // Write waypoints into the live roads object immediately
  roads[traceRoadId].waypoints = traceWaypoints.slice();

  // Build output string for copy-paste into code
  const waypointStr = traceWaypoints.map(([lat,lng]) =>
    `  [${Math.round(lat)}, ${Math.round(lng)}]`
  ).join(',\n');

  const output = `// Paste this into roads.${traceRoadId}.waypoints:\n[\n${waypointStr}\n]`;

  const outEl = tracePanel.querySelector('#traceOutput');
  outEl.textContent = output;
  outEl.style.display = 'block';

  // Copy to clipboard
  navigator.clipboard.writeText(`[\n${waypointStr}\n]`).catch(()=>{});

  modeBanner.textContent = `✓ ${roads[traceRoadId].name} traced (${traceWaypoints.length} points) — copied to clipboard! Road is now active.`;

  // Clean up trace visuals but keep panel open so user can copy output
  traceMarkers.forEach(m => map.removeLayer(m));
  traceMarkers = [];
  if (tracePolyline) { map.removeLayer(tracePolyline); tracePolyline = null; }

  // Draw the finished road as a permanent preview
  const finishedLine = L.polyline(roads[traceRoadId].waypoints, {
    color: '#f0c040', weight: 2, opacity: 0.5
  }).addTo(map);
  window._roadLines = window._roadLines || [];
  window._roadLines.push(finishedLine);

  toolMode = 'off';
  map.getContainer().style.cursor = '';
  tracePanel.querySelector('#traceCount').textContent = traceWaypoints.length + ' points ✓';

  // Refresh markers — road positions will now resolve correctly
  renderMarkers(curCh, currentGlowId);
}
