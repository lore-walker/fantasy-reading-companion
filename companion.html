// ─── STATE ───────────────────────────────────────────────────────────────────

let curCh = 1;
let curPhase = 'before'; // 'before' = opening the chapter, 'after' = just finished it
let showDeceased = true;
let openPanelId = null;
let freeLook = false;

// The "snap to character" zoom (used when advancing chapters) was zoomed in
// too far. This pulls it back by 1 zoom level on desktop and 2 on mobile —
// mobile screens are smaller, so the same zoom level feels more cropped.
// 700px matches the @media breakpoint used for the mobile layout above.
function getSnapZoom(){
  return window.innerWidth <= 700 ? -1.0 : 0.0;
}
const markers = {};
// Persistent location dots, one per character id but shared by reference
// when characters occupy the same spot — see renderMarkers() and the
// travel animation (animateLeg()/playGroup()) further down. This is the
// "ground truth" location marker; the ribbon (in `markers`) is just its
// label and can fan out for readability.
const dots = {};

// ─── CHAPTER NAV ─────────────────────────────────────────────────────────────


function getChObj(n){ return allChapters.find(c=>c.n===n) || {n, name:"Chapter "+n}; }

// Each chapter has two stops: Before N (index 2N) and After N (index 2N+1).
// Stepping ±1 in index-space moves through Before/After in the right order:
// ...Before 1, After 1, Before 2, After 2...
function toIndex(ch, phase){ return ch * 2 + (phase === 'after' ? 1 : 0); }
function fromIndex(idx){ return { ch: Math.floor(idx / 2), phase: (idx % 2 === 0) ? 'before' : 'after' }; }
const MIN_STEP = toIndex(0, 'before');
let MAX_STEP = toIndex(0, 'after');

// stepCh() itself is defined further down, alongside the travel animation
// it now conditionally routes into — see "CHARACTER TRAVEL ANIMATION" below.
// Jumping via the dropdown always lands on Before N — a deliberate refresher
// stop, not a full skip into what N contains.
function jumpTo(val){ if(val) setChapter(parseInt(val), 'before'); }

// ─── CHARACTER LOGIC ─────────────────────────────────────────────────────────

function resolvePos(entry) {
  // Road entry format: { from, to, road:"kingsroad", pct:0.45, place:"...", note:"..." }
  // pct can also be a named stop string e.g. pct:"winterfell"
  // Raw px() entries pass through unchanged.
  if (!entry || !entry.road) return entry;
  const resolved = getRoadPos(entry.road, entry.pct);
  if (!resolved) {
    console.warn(`Road "${entry.road}" has no waypoints yet. Use ✏️ Trace Road to record it.`);
    return null;
  }
  return { from: entry.from, to: entry.to, pos: resolved, place: entry.place, note: entry.note, status: entry.status };
}

// ─── ARRIVAL / TRANSIT MODEL (Session 14) ──────────────────────────────────
// A position entry is one of two kinds:
//   kind:"arrival" — a real, textually-confirmed place. Eligible to be
//                    shown as "last known position" and to move the
//                    resting marker. Defaults to "arrival" when omitted
//                    (safe default for entries not yet reclassified).
//   kind:"transit" — describes travel between two arrivals (a road/pct or
//                    a rough px() waypoint). NEVER changes "place" or the
//                    resting marker. Only used for (a) an optional note
//                    override, shown while the reader is between arrivals
//                    (e.g. "planning to set sail" without actually moving
//                    the marker), and (b) building the animated route once
//                    the NEXT arrival is confirmed.
// Position Rule 1 (PROJECT_CONTEXT.md) no longer allows "departure or
// arrival" to move the marker — only arrival. A transit entry, however
// specific its wording, is explicitly excluded from that gate.
function isArrival(p){ return (p.kind || 'arrival') === 'arrival'; }
function isTransit(p){ return p.kind === 'transit'; }

// The confirmed arrival active at ch/curPhase — same phase-aware search as
// before, but restricted to arrival entries only.
// `phase` is optional on all three functions below — omit it and they read
// the global curPhase exactly as before. The Chapter Reveal (further down)
// passes 'after' explicitly while curPhase is still 'before', purely to
// look ahead at where this chapter's POV character will end up so the
// camera can move there silently behind the dim.
function getActiveArrival(c, ch, phase){
  phase = phase || curPhase;
  // AT6 (Session 15) removed the firstChapter gate entirely so a character
  // could show a position before their own POV debut (e.g. Sansa at
  // Winterfell in ch4, ahead of her ch15 debut). That's superseded now: a
  // POV character's own first-ever series appearance is a spoiler-sensitive
  // moment on its own (see Chapter Reveal below), so the gate is back —
  // UNLESS this character is marked `continuingPOV:true`, meaning they
  // already had their own POV chapter in an earlier book. For a continuing
  // character, THIS book's `firstChapter` isn't a debut at all — it's just
  // where this book's own narration catches up to them — so they may still
  // carry a position from before it (typically a `from:0` entry picking up
  // where the previous book left off).
  if(!c.continuingPOV && !isRevealed(c.firstChapter, ch, phase)) return null;
  if(!c.positions || c.positions.length === 0) return null;
  const arrivals = c.positions.filter(isArrival);
  if(!arrivals.length) return null;
  // AT7 (this session) — keep the LAST direct match, not the first. Two
  // arrivals can legitimately share the same chapter window (e.g. a chapter
  // that confirms a character stops at a waypoint and then reaches their
  // real destination all in its own text) — chronological array order means
  // the later, more authoritative one should win, matching how the
  // lastKnown fallback just below already resolves ties by "keep
  // overwriting with whatever's later." Without this, whichever of the two
  // happened to be entered first in the array would win regardless of which
  // one the text actually settles on.
  let directMatch = null;
  for(let p of arrivals) if(isRevealed(p.from, ch, phase) && ch <= p.to) directMatch = p;
  if(directMatch) return directMatch;
  let lastKnown = null;
  for(let p of arrivals){ if(isRevealed(p.from, ch, phase)) lastKnown = p; }
  return lastKnown; // null if nothing has been revealed yet — correctly hidden
}

// A transit entry's note can surface WITHOUT moving the marker — e.g.
// "planning to set sail for King's Landing" at the chapter that actually
// says so, while "place" stays frozen at the last real arrival.
function getActiveTransitNote(c, ch, phase){
  phase = phase || curPhase;
  if(!c.positions) return null;
  // Same debut gate as getActiveArrival() above — without this, a transit
  // note could leak a not-yet-revealed character's travel status even
  // though getActiveArrival() itself correctly returns null for them.
  if(!c.continuingPOV && !isRevealed(c.firstChapter, ch, phase)) return null;
  // A transit's note only applies while the reader hasn't yet reached the
  // arrival it leads into — once that arrival is itself active (its own
  // "from" is later than this transit's), the transit is in the past and
  // must not keep overriding the new arrival's own note. This matters
  // because transit ranges are deliberately extended through the arrival
  // chapter's own "opening" (see Session 14 CHANGELOG) so the note doesn't
  // revert oddly right before arrival — but that means the transit and the
  // next arrival briefly share the same chapter number, and only phase
  // (via the active-arrival comparison below) can tell them apart.
  const activeArrival = getActiveArrival(c, ch, phase);
  for(let p of c.positions){
    if(!isTransit(p)) continue;
    if(!isRevealed(p.from, ch, phase) || ch > p.to) continue;
    if(activeArrival && activeArrival.from > p.from) continue;
    return p.note;
  }
  return null;
}

function getPos(c, ch, phase){
  const arrival = getActiveArrival(c, ch, phase);
  if(!arrival) return null;
  const resolved = resolvePos(arrival);
  if(!resolved) return null;
  const transitNote = getActiveTransitNote(c, ch, phase);
  return transitNote !== null ? { ...resolved, note: transitNote } : resolved;
}

// Kept for callers that still want the raw (unresolved) ARRIVAL entry —
// e.g. anything checking a character's current road/pct outside of an
// animation. Multi-leg animation (below) uses getTransitChain() instead,
// since it needs every leg between two arrivals, not just one.
function getRawPosEntry(c, ch){
  return getActiveArrival(c, ch);
}

// Every transit entry strictly between two arrivals, in the order they
// appear in c.positions (the array is expected to stay chronological).
// This is what the animation walks as one continuous multi-stop flight,
// however many now-finished chapters those legs were originally attached
// to — e.g. Catelyn's Winterfell -> White Harbor -> at sea -> King's
// Landing, all animated in the single step where King's Landing (the next
// arrival) is confirmed, per Session 14's reveal model.
function getTransitChain(c, prevArrival, nextArrival){
  if(!c.positions) return [];
  const startIdx = c.positions.indexOf(prevArrival);
  const endIdx = c.positions.indexOf(nextArrival);
  if(startIdx === -1 || endIdx === -1 || endIdx <= startIdx) return [];
  return c.positions.slice(startIdx + 1, endIdx).filter(isTransit);
}

// ─── TRAVEL ANIMATION (restored, reworked — see CHANGELOG) ─────────────────
// Everything below this point re-implements the character travel tracker
// that an earlier session removed. Unlike the old version, the map now
// snaps to a character's LAST KNOWN position on a chapter's "before" phase
// (see renderChapterMap()) rather than pre-jumping to where they'll end up
// — the travel animation below is what actually carries them from the old
// spot to the new one, once the reader reaches "finished."

// Same idea as getTransitChain() above, but unfiltered — includes any
// ARRIVAL entries strictly between the two endpoints too. An arrival that
// falls strictly between a mover's starting point and their final
// confirmed destination isn't itself "the" current position (getActiveArrival
// already resolved past it to the later one), but for the animation it's a
// real, textually-confirmed stop along the way — e.g. the Inn at the
// Crossroads — and should pause the travel there rather than blowing
// straight through it.
function getJourneyChain(c, prevArrival, nextArrival){
  if(!c.positions) return [];
  const startIdx = c.positions.indexOf(prevArrival);
  const endIdx = c.positions.indexOf(nextArrival);
  if(startIdx === -1 || endIdx === -1 || endIdx <= startIdx) return [];
  return c.positions.slice(startIdx + 1, endIdx);
}

// Rounds a [lat,lng] to a short string key so two independently-authored
// position entries that resolve to the "same place" (e.g. two characters
// both confirmed at Winterfell) compare equal for grouping/animation
// purposes without needing exact floating-point equality.
function posKey(pos){ return pos[0].toFixed(3) + ',' + pos[1].toFixed(3); }

// One resolved leg between two RAW position entries (not necessarily
// arrivals — a journey stop can be a transit entry too). Follows a named
// road's real waypoints when both ends share one road; otherwise a
// straight line. Factored out of buildFlightPath() below so the travel
// animation can compute a single hop the same way the untraced-route
// measurement does.
function legBetween(entryA, entryB){
  const A = resolvePos(entryA), B = resolvePos(entryB);
  if(!A || !B) return null;
  if(entryA.road && entryB.road && entryA.road === entryB.road){
    const distA = roadDistanceAt(entryA.road, entryA.pct), distB = roadDistanceAt(entryB.road, entryB.pct);
    return { kind:'road', roadId:entryA.road, distA, distB, length: Math.abs(distB - distA) };
  }
  const dLat = B.pos[0]-A.pos[0], dLng = B.pos[1]-A.pos[1];
  return { kind:'straight', fromPos:A.pos, toPos:B.pos, length: Math.sqrt(dLat*dLat + dLng*dLng) };
}

// The full ordered path a single character walks between two confirmed
// arrivals this chapter — every stop is {entry, resolved, isPause}.
// `isPause` marks a stop that is itself a real, textually-confirmed
// ARRIVAL (not the departure or the final destination) — a key location or
// event along the way that should hold the travel for a beat. Plain
// transit entries in between are path only; they never pause.
function buildJourneyStops(c, prevArrival, nextArrival){
  const chain = getJourneyChain(c, prevArrival, nextArrival);
  const raw = [prevArrival, ...chain, nextArrival];
  return raw.map((entry, i) => {
    const resolved = resolvePos(entry);
    if(!resolved) return null; // e.g. an untraced road — skip rather than crash
    const isPause = i > 0 && i < raw.length - 1 && isArrival(entry);
    return { entry, resolved, isPause };
  }).filter(Boolean);
}

// Every arrival-to-arrival journey still relying on a straight-line
// approximation (no real traced route, and no single named road covers the
// whole hop) — surfaced in the 🧭 Untraced Routes dev tool so someone can
// walk the actual path and send back real waypoints, the same workflow as
// ✏️ Trace Road for the shared named roads.
const UNTRACED_LENGTH_THRESHOLD = 200; // map units — skip trivial local hops
function getUntracedFlights(){
  const results = [];
  allChars.filter(c => c.isPov).forEach(c => {
    const arrivals = (c.positions || []).filter(isArrival);
    for(let i = 1; i < arrivals.length; i++){
      const prevArrival = arrivals[i-1], nextArrival = arrivals[i];
      if(nextArrival.route && nextArrival.route.length > 1) continue; // already traced
      const legs = buildFlightPath(c, prevArrival, nextArrival);
      const hasUntracedStraight = legs.some(leg => leg.kind === 'straight' && leg.length > UNTRACED_LENGTH_THRESHOLD);
      if(hasUntracedStraight){
        results.push({ charId: c.id, charName: c.name, fromPlace: prevArrival.place, toPlace: nextArrival.place, prevArrival, nextArrival });
      }
    }
  });
  return results;
}

// ─── READING MODEL ──────────────────────────────────────────────────────────
// Every gate in the app (tiers, deaths, panel intros, tooltip notes) answers
// the same question: "has the reader gotten far enough to know this yet?"
// There are two states per chapter, not one:
//   Before Chapter N — about to read N. Reveal chapter must be strictly
//                      earlier than N (revealChapter < N).
//   After Chapter N  — just finished N. Reveal chapter may equal N
//                      (revealChapter <= N), since N's own events now count.
// isRevealed() is the single place that encodes this, so every gate in the
// file compares against the same rule instead of picking its own operator.
function isRevealed(revealChapter, ch, phase){
  return phase === 'after' ? revealChapter <= ch : revealChapter < ch;
}

function isDeadAt(c, ch){ return c.deathChapter !== null && isRevealed(c.deathChapter, ch, curPhase) && c.deathStatus === 'dead'; }
function isMissingAt(c, ch){ return c.deathChapter !== null && isRevealed(c.deathChapter, ch, curPhase) && c.deathStatus === 'missing'; }

function buildTierText(c, ch){
  return c.tiers.filter(t => isRevealed(t.revealChapter, ch, curPhase)).map(t => t.text).join(' ');
}

// ─── RIBBON MARKERS ──────────────────────────────────────────────────────────

// Builds the fold-shading overlay used by makeRibbonHTML(). This is a
// left-to-right gradient of translucent white and black bands painted ON
// TOP of the character's flat ink colour, which is what makes the flat
// shape read as rippling cloth: the white bands are where a fold catches
// the light, the black bands are where it turns away.
//
// The two END stops are the important ones. They're the darkest in the
// gradient, so the cloth fades into shadow as it approaches each pointed
// tail. That's what removes the hard seam the old design had, where the
// tails were separate flat-coloured polygons stuck onto the body.
//
// `k` scales only those end stops. Live banners use 1 (full depth); dead
// and missing ones use a much lower value, because heavy shading on top
// of the grey `#666` fill turns the banner muddy and swallows the
// strikethrough on the name.
function silkFoldGradient(id, k){
  return `<linearGradient id="${id}" x1="0" x2="1">
      <stop offset="0"    stop-color="#000" stop-opacity="${(0.42 * k).toFixed(3)}"/>
      <stop offset="0.10" stop-color="#000" stop-opacity="${(0.26 * k).toFixed(3)}"/>
      <stop offset="0.22" stop-color="#fff" stop-opacity="0.20"/>
      <stop offset="0.36" stop-color="#000" stop-opacity="0.19"/>
      <stop offset="0.5"  stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.64" stop-color="#000" stop-opacity="0.19"/>
      <stop offset="0.78" stop-color="#fff" stop-opacity="0.20"/>
      <stop offset="0.90" stop-color="#000" stop-opacity="${(0.26 * k).toFixed(3)}"/>
      <stop offset="1"    stop-color="#000" stop-opacity="${(0.42 * k).toFixed(3)}"/>
    </linearGradient>`;
}

function makeRibbonHTML(name, ink, isDead, isMissing, textInk){
  const displayInk = (isDead || isMissing) ? '#666' : ink;
  const textColor = (isDead || isMissing) ? '#aaa' : (textInk || '#f5ecd0');
  const opacity = (isDead || isMissing) ? 0.55 : 1;
  const strike = (isDead || isMissing) ? 'text-decoration:line-through;' : '';

  // Two fixed gradient ids rather than one unique id per banner. Every
  // live banner's gradient is byte-for-byte identical (the shading is
  // pure black/white overlay and doesn't depend on the character's ink),
  // so all of them can safely point at the same id — the browser resolves
  // a duplicate id to the first match in the document, which is an
  // identical gradient. renderMarkers() rebuilds every marker's DOM on
  // each call, so generating unique ids here would churn out a fresh
  // gradient definition per character per render for no visual gain.
  const gradId = (isDead || isMissing) ? 'silkFoldMuted' : 'silkFold';
  const gradK  = (isDead || isMissing) ? 0.45 : 1;

  // ── Banner geometry ──
  // charW drives the width, exactly as before. NOTE the tails are now
  // part of the banner's single outline rather than separate shapes
  // bolted onto a box, so `totalW` is the whole thing in one number.
  // It works out to the same value the old box-plus-tails maths gave
  // (name.length * charW + 26, + 26 for tails), which is why the iconW
  // calc in renderMarkers() below is unchanged.
  const charW  = 9.5;
  const totalW = name.length * charW + 52;
  const cx     = totalW / 2;
  const top    = 4;    // y of the top hem at rest
  const bot    = 24;   // y of the bottom hem at rest
  const midY   = (top + bot) / 2;
  const notch  = 10;   // how far the swallowtail V bites into each end
  const a      = 1;    // ripple amplitude — raise for a windier flag

  // The top hem, drawn left to right as four quadratic curves. Each `Q`
  // is "curve toward this control point, and end up here"; alternating
  // the control point above and below the hem line is what produces the
  // wave. The bottom hem is the same wave offset down by (bot - top),
  // drawn right to left, so the cloth keeps a constant thickness through
  // every fold instead of pinching.
  const topEdge =
    `M0,${top} ` +
    `Q${totalW*0.125},${top + 5*a} ${totalW*0.25},${top + a} ` +
    `Q${totalW*0.375},${top - 2.5*a} ${totalW*0.5},${top} ` +
    `Q${totalW*0.625},${top + 2.5*a} ${totalW*0.75},${top + a} ` +
    `Q${totalW*0.875},${top - 2.5*a} ${totalW},${top}`;
  const botEdge =
    `Q${totalW*0.875},${bot - 2.5*a} ${totalW*0.75},${bot + a} ` +
    `Q${totalW*0.625},${bot + 2.5*a} ${totalW*0.5},${bot} ` +
    `Q${totalW*0.375},${bot - 2.5*a} ${totalW*0.25},${bot + a} ` +
    `Q${totalW*0.125},${bot + 5*a} 0,${bot}`;

  // One continuous outline: across the top, into the right-hand
  // swallowtail notch and back out, along the bottom, then into the
  // left-hand notch and closed. Every layer below reuses this same path.
  const d =
    `${topEdge} L${totalW - notch},${midY} L${totalW},${bot} ` +
    `${botEdge} L${notch},${midY} Z`;

  return `<svg width="${totalW}" height="38" xmlns="http://www.w3.org/2000/svg" style="opacity:${opacity}">
    <defs>${silkFoldGradient(gradId, gradK)}</defs>
    <!-- cast shadow: the same silhouette, nudged down-right, so the
         banner sits above the map rather than printed flat on it -->
    <g transform="translate(2,3)" opacity="0.38"><path d="${d}" fill="#000"/></g>
    <!-- flat house colour -->
    <path d="${d}" fill="${displayInk}"/>
    <!-- fold shading painted over it -->
    <path d="${d}" fill="url(#${gradId})"/>
    <!-- hairline edge, just enough to keep the cloth from bleeding into
         a similarly-coloured patch of map -->
    <path d="${d}" fill="none" stroke="#000" stroke-opacity="0.28" stroke-width="0.6" stroke-linejoin="round"/>
    <!-- text, drawn twice: a dark copy 1px lower reads as the name being
         embroidered into the cloth rather than floating above it -->
    <text x="${cx}" y="19" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-style="italic" fill="#000" opacity="0.45" style="${strike}" letter-spacing="0.4">${name}</text>
    <text x="${cx}" y="18" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-style="italic" fill="${textColor}" style="${strike}" letter-spacing="0.4">${name}</text>
    <!-- anchor dot -->
    <circle cx="${cx}" cy="32" r="2.5" fill="${displayInk}" opacity="0.75"/>
  </svg>`;
}

// Pure state computation — no DOM/Leaflet calls. Figures out, for a given
// chapter, which POV characters are visible, what their true location
// (anchorPos) and fanned-out label position (ribbonPos) are, and the raw
// position entry behind it (for road-following animation). Returns an
// object keyed by character id. renderMarkers() (below) is just this plus
// the Leaflet drawing calls; the marker-movement animation calls this twice
// (before and after a step) to diff what actually moved.
function computeMarkerState(ch, resolvePosForChar){
  resolvePosForChar = resolvePosForChar || (c => getPos(c, ch));
  const povChars = allChars.filter(c => c.isPov);
  const groups = {};
  povChars.forEach(c => {
    const pos = resolvePosForChar(c);
    if(!pos) return;
    const dead = isDeadAt(c, ch);
    const missing = isMissingAt(c, ch);
    if((dead || missing) && !showDeceased) return;
    const rawEntry = getRawPosEntry(c, ch);
    const key = pos.pos[0] + ',' + pos.pos[1];
    if(!groups[key]) groups[key] = {anchorPos: pos.pos, chars: []};
    groups[key].chars.push({c, pos, dead, missing, rawEntry});
  });

  const state = {};
  Object.values(groups).forEach(group => {
    const {anchorPos, chars} = group;
    const fanOffsets = getFanOffsets(chars.length, anchorPos);
    chars.forEach(({c, pos, dead, missing, rawEntry}, i) => {
      state[c.id] = {
        c, pos, dead, missing, rawEntry, anchorPos,
        ribbonPos: fanOffsets[i],
        needsLeader: chars.length > 1
      };
    });
  });
  return state;
}

// `resolvePosForChar`, if given, overrides where a character's position is
// read from — used by the travel animation below to feed it a live,
// mid-flight interpolated spot instead of the resting getPos() lookup.
// Omit it for normal, static rendering (the vast majority of calls).
// Known simplification: like the old marker-walking animation this
// replaces, every call still fully clears and rebuilds all markers/dots
// rather than moving persistent Leaflet objects via setLatLng — acceptable
// at this app's character-count scale, but worth revisiting if it ever
// reads as janky on real hardware (not yet verified outside jsdom/headless
// testing).
function renderMarkers(ch, glowId, resolvePosForChar){
  // Clear existing markers and leader lines
  Object.values(markers).forEach(m => map.removeLayer(m));
  Object.keys(markers).forEach(k => delete markers[k]);
  if(window._leaderLines){
    window._leaderLines.forEach(l => map.removeLayer(l));
  }
  window._leaderLines = [];
  Object.keys(dots).forEach(k => delete dots[k]);

  const state = computeMarkerState(ch, resolvePosForChar);

  // One persistent dot per unique anchor (not per character) — the dot IS
  // the location; a ribbon is just its label, fanned out for readability
  // when several characters share a spot. Every character's id maps into
  // `dots`, but characters sharing a location point at the SAME dot object.
  const dotByAnchorKey = {};

  Object.values(state).forEach(({c, pos, dead, missing, anchorPos, ribbonPos, needsLeader}) => {
      const anchorKey = anchorPos[0] + ',' + anchorPos[1];
      let dot = dotByAnchorKey[anchorKey];
      if(!dot){
        dot = L.circleMarker(anchorPos, {
          radius: 3,
          color: '#c8a850',
          fillColor: '#c8a850',
          fillOpacity: 1,
          weight: 1.5,
          interactive: false
        }).addTo(map);
        window._leaderLines.push(dot);
        dotByAnchorKey[anchorKey] = dot;
      }
      dots[c.id] = dot;

      const html = makeRibbonHTML(c.name, c.ink, dead, missing, c.textInk);
      // Must match the totalW calc inside makeRibbonHTML() above.
      const iconW = c.name.length * 9.5 + 52;
      let glowClass = '';
      if(c.id === glowId){
        // First time this glowId is rendered → play the fade-in. Every
        // later render for the same glowId (travel frames, zoom, redundant
        // settle calls) → hold the static, already-settled glow instead.
        glowClass = (glowRevealPlayedFor === glowId) ? ' banner-glow-static' : ' banner-glow';
        glowRevealPlayedFor = glowId;
      }
      const icon = L.divIcon({
        html,
        className: 'ribbon-label' + glowClass,
        // y must sit on the anchor dot drawn at the bottom of the banner
        // SVG (cy="32"), or the ribbon floats off its true map position.
        // Was 29 when the banner was 34px tall; the silk banner is 38.
        iconAnchor: [iconW / 2, 32]
      });

      const marker = L.marker(ribbonPos, {icon, interactive:true}).addTo(map);

      // Leader line from ribbon to the shared dot — only needed when the
      // ribbon is actually fanned out away from it (more than one
      // character at this location). A solo character's ribbon sits right
      // on top of its dot, so no line is needed.
      if(needsLeader){
        const lineColor = (dead || missing) ? '#666' : c.ink;
        const line = L.polyline([anchorPos, ribbonPos], {
          color: lineColor,
          weight: 1.5,
          opacity: 0.85,
          dashArray: '4, 3'
        }).addTo(map);
        window._leaderLines.push(line);
      }

      // Tooltip
      // The status suffix (e.g. "imprisoned", "King in the North") and the
      // note both describe what happens IN this position's chapter, so both
      // are gated by the same isRevealed check — place alone (the city name)
      // is never gated, since knowing which city a chapter opens in isn't a
      // spoiler the way what happens there is.
      let tipHtml = `<div class="tip-name">${c.name}</div>`;
      if(dead) tipHtml += `<div class="tip-dead">&#9760; Deceased — ${c.deathNote}</div>`;
      else if(missing) tipHtml += `<div class="tip-missing">&#63; Missing — ${c.deathNote}</div>`;
      else {
        const eventRevealed = isRevealed(pos.from, ch, curPhase);
        const placeLine = (eventRevealed && pos.status) ? `${pos.place} — ${pos.status}` : pos.place;
        tipHtml += `<div class="tip-place">${placeLine}</div>`;
        if(eventRevealed) tipHtml += `<div class="tip-note">${pos.note}</div>`;
      }

      marker.bindTooltip(tipHtml, {
        className: 'ribbon-tip',
        direction: 'top',
        // -23 rather than -20: the silk banner reaches 3px higher above
        // its anchor than the old ribbon did, so the tooltip moves up by
        // the same 3px to keep the gap between them looking unchanged.
        offset: [0, -23],
        sticky: false
      });

      // Tooltips normally open on hover, but phones/tablets have no hover
      // state — so tapping a marker toggles its tooltip open/closed too.
      marker.on('click', function(e) {
        if (this.isTooltipOpen()) {
          this.closeTooltip();
        } else {
          closeAllTooltips();
          this.openTooltip();
        }
        L.DomEvent.stopPropagation(e);
      });

      markers[c.id] = marker;
  });
}

function getFanOffsets(count, anchorPos){
  // Returns ribbon positions stacked to the left, clamped between a min and
  // max screen-pixel distance so they stay close at all zoom levels.
  if(count === 1) return [anchorPos];

  const [lat, lng] = anchorPos;

  const zoom = map.getZoom();
  const scale = Math.pow(2, zoom);

  // Desired screen distances — clamped so they never get too far or too close
  const rawOffsetX = 160;          // ideal left offset in screen px
  // Vertical step widened again for the silk banner. The cloth itself is
  // about the same height as the old ribbon, but its cast shadow hangs
  // ~3px below the hem, so a stack of banners needs a little more room
  // before the shadow of one starts touching the next.
  const rawStepY   = 38;           // ideal vertical step in screen px
  const minOffsetX = 60;           // never closer than this (px)
  const maxOffsetX = 120;          // never further than this (px)
  const minStepY   = 30;
  const maxStepY   = 40;

  const clamp = (val, mn, mx) => Math.min(mx, Math.max(mn, val));
  const screenOffsetX = clamp(rawOffsetX, minOffsetX, maxOffsetX);
  const screenStepY   = clamp(rawStepY,   minStepY,   maxStepY);

  // Convert clamped screen px → map units
  const mapOffsetLng = -(screenOffsetX / scale);
  const mapStepLat   =  (screenStepY   / scale);

  const totalHeight = (count - 1) * mapStepLat;
  const startLat = lat + totalHeight / 2;

  const offsets = [];
  for(let i = 0; i < count; i++){
    offsets.push([startLat - i * mapStepLat, lng + mapOffsetLng]);
  }
  return offsets;
}

// ─── PANELS ──────────────────────────────────────────────────────────────────

function buildCard(c, ch){
  const dead = isDeadAt(c, ch);
  const missing = isMissingAt(c, ch);
  const statusClass = dead ? 'status-dead' : missing ? 'status-missing' : 'status-alive';
  const statusLabel = dead ? 'Deceased' : missing ? 'Missing' : 'Active';
  const tierText = buildTierText(c, ch);
  const div = document.createElement('div');
  div.className = 'char-card';
  div.innerHTML = `
    <div class="char-card-header" onclick="toggleDetail(this)">
      <div class="char-swatch" style="background:${c.ink}"></div>
      <div style="flex:1">
        <div class="char-name">${c.name}</div>
        <div class="char-role">${c.house ? c.house + ' · ' : ''}${c.role}</div>
      </div>
      <span class="char-status ${statusClass}">${statusLabel}</span>
      <span class="char-expand">&#9660;</span>
    </div>
    <div class="char-detail">
      <div class="reveal-tier">${tierText || 'No information recorded yet.'}</div>
      ${dead ? `<div class="reveal-tier fate-note"><strong>Fate:</strong> ${c.deathNote}</div>` : ''}
      ${missing ? `<div class="reveal-tier missing-note"><strong>Last known:</strong> ${c.deathNote}</div>` : ''}
    </div>`;
  return div;
}

function toggleDetail(header){
  const detail = header.nextElementSibling;
  const arrow = header.querySelector('.char-expand');
  const open = detail.classList.contains('open');
  detail.classList.toggle('open');
  detail.style.display = open ? 'none' : 'block';
  if(arrow) arrow.textContent = open ? '▼' : '▲';
}

function openPanel(id){
  const overlay = document.getElementById('panelOverlay');
  const body = document.getElementById('panelBody');
  const titleEl = document.getElementById('panelTitle');

  openPanelId = id;
  overlay.classList.add('open');

  // Update filter button states
  ['side','glossary','deceased'].forEach(p => {
    const btn = document.getElementById('btn' + p[0].toUpperCase() + p.slice(1));
    if(btn) btn.classList.toggle('active', p === id);
  });

  body.innerHTML = '';

  if(id === 'side'){
    titleEl.textContent = 'Primary Characters';
    const vis = allChars.filter(c => c.isPov && isRevealed(c.firstChapter, curCh, curPhase));
    if(!vis.length){
      body.innerHTML = '<p class="empty-note">No POV characters introduced yet.</p>';
    } else {
      vis.forEach(c => body.appendChild(buildCard(c, curCh)));
    }
  } else if(id === 'glossary'){
    titleEl.textContent = 'Character Glossary';
    // Show a character from their sideChapter (first referenced) or firstChapter.
    // For POV chars not yet at their first POV chapter, render using sideTiers.
    const all = [...allChars].filter(c => {
      const introAt = (c.isPov && c.sideChapter) ? c.sideChapter : c.firstChapter;
      return isRevealed(introAt, curCh, curPhase);
    }).sort((a,b) => a.name.localeCompare(b.name));
    if(!all.length){
      body.innerHTML = '<p class="empty-note">No characters introduced yet.</p>';
    } else {
      all.forEach(c => {
        // Use side version for POV chars before their first POV chapter
        const useAsSide = c.isPov && c.sideChapter && !isRevealed(c.firstChapter, curCh, curPhase);
        if(useAsSide){
          const sideChar = Object.assign({}, c, {isPov:false, tiers:c.sideTiers});
          body.appendChild(buildCard(sideChar, curCh));
        } else {
          body.appendChild(buildCard(c, curCh));
        }
      });
    }
  } else if(id === 'deceased'){
    titleEl.textContent = 'Deceased & Missing';
    const rel = allChars.filter(c => isRevealed(c.firstChapter, curCh, curPhase) && c.deathChapter !== null && isRevealed(c.deathChapter, curCh, curPhase));
    if(!rel.length){
      body.innerHTML = '<p class="empty-note">No deaths or disappearances recorded yet.</p>';
    } else {
      rel.forEach(c => body.appendChild(buildCard(c, curCh)));
    }
  }
}

function closePanel(){
  document.getElementById('panelOverlay').classList.remove('open');
  ['side','glossary','deceased'].forEach(p => {
    const btn = document.getElementById('btn' + p[0].toUpperCase() + p.slice(1));
    if(btn) btn.classList.remove('active');
  });
  // Keep deceased filter button active state separate
  document.getElementById('btnDeceased').classList.toggle('active', showDeceased);
  openPanelId = null;
}

function toggleDeceased(){
  showDeceased = !showDeceased;
  document.getElementById('btnDeceased').classList.toggle('active', showDeceased);
  if(showDeceased && openPanelId !== 'side' && openPanelId !== 'glossary'){
    // don't auto-open panel, just update map
  }
  renderMarkers(curCh, currentGlowId);
}

// ─── CHAPTER POV MAP ────────────────────────────────────────────────────────
let chapterPOV = {};

// ─── CHAPTER UPDATE ──────────────────────────────────────────────────────────

// Builds the always-visible recap line: "Opening"/"Finished" the chapter,
// plus what the reader currently knows about that chapter's POV character.
// Before N shows only their last confirmed place (a refresher, no spoilers
// from N). After N shows the note for N's events, once isRevealed says so.
function buildRecapHTML(ch, phase){
  const chObj = getChObj(ch);
  const tag = phase === 'after' ? 'Finished' : 'Opening';
  const povId = chapterPOV[ch];
  let body;
  if(!povId){
    body = phase === 'after' ? `The ${chObj.name} has ended.` : `About to begin the ${chObj.name}.`;
  } else {
    const povChar = allChars.find(c => c.id === povId);
    const pos = povChar ? getPos(povChar, ch) : null;
    if(!povChar){
      body = '';
    } else if(!pos && phase === 'before'){
      // Never been placed anywhere before, and the chapter hasn't happened
      // yet — nothing truthful to show. Stay silent rather than announce
      // "first appearance," which is itself a bit of a tell. Comes back
      // once the reader finishes the chapter and we have a real position.
      body = '';
    } else if(!pos){
      body = `<strong>${povChar.name}</strong> — first appearance.`;
    } else if(phase === 'before'){
      body = `<strong>${povChar.name}</strong> — last seen: ${pos.place}.`;
    } else {
      const eventRevealed = isRevealed(pos.from, ch, phase);
      body = `<strong>${povChar.name}</strong> — ${eventRevealed ? pos.note : 'no new developments recorded.'}`;
    }
  }
  return `<span class="recap-tag">${tag} · Ch. ${ch} — ${chObj.name}</span><span class="recap-sep">|</span>${body}`;
}

// Splits what used to be one setChapter() into three pieces so the animated
// advance (below) can reuse the UI/camera logic while taking manual control
// of marker rendering during the tween:
//   updateChapterUI() — text, buttons, recap panel, status bar (no map)
//   flyToCurrentPOV() — camera pan/zoom to the chapter's POV character
//   setChapter()      — the original instant path: UI + markers + camera
function updateChapterUI(){
  const chObj = getChObj(curCh);
  document.getElementById('chDisplay').innerHTML = `Ch. ${curCh} — <span>${chObj.name}</span>`;
  const idx = toIndex(curCh, curPhase);
  document.getElementById('prevBtn').disabled = idx <= MIN_STEP;
  document.getElementById('nextBtn').disabled = idx >= MAX_STEP;
  document.getElementById('jumpMenu').value = '';
  document.getElementById('recapPanel').innerHTML = buildRecapHTML(curCh, curPhase);

  if(openPanelId) openPanel(openPanelId);

  const deadCount = allChars.filter(c => isRevealed(c.firstChapter, curCh, curPhase) && c.deathChapter && isRevealed(c.deathChapter, curCh, curPhase)).length;
  const activeCount = allChars.filter(c => c.isPov && getPos(c, curCh)).length;
  const asOf = curPhase === 'after' ? 'through' : 'entering';
  document.getElementById('statusBar').textContent =
    `A Game of Thrones  ·  ${activeCount} POV character${activeCount !== 1 ? 's' : ''} active  ·  ${deadCount} death${deadCount !== 1 ? 's' : ''}/disappearance${deadCount !== 1 ? 's' : ''} recorded ${asOf} Chapter ${curCh}`;
}

// Most of the time the Chapter Reveal has already silently pre-positioned
// the camera behind the dim (see renderChapterMap()), so this pan has
// nowhere left to go. It still matters when landing directly on an
// already-read "finished" chapter (stepping backward with Prev) — that
// jump skips the dim/pre-position step entirely, so the camera has to
// travel for real. Duration scales with the actual distance so a short
// local hop and a trip across the whole continent don't move at different
// apparent speeds — one consistent, unhurried pace throughout.
const CAMERA_SPEED_UNITS_PER_MS = 0.5; // 3x quicker than the previous 0.5/3 pace
const CAMERA_MIN_DURATION_S = 0.3;
function flyDurationSeconds(fromLatLng, toLatLng){
  const dLat = toLatLng[0] - fromLatLng.lat, dLng = toLatLng[1] - fromLatLng.lng;
  const dist = Math.sqrt(dLat*dLat + dLng*dLng);
  return Math.max(CAMERA_MIN_DURATION_S, (dist / CAMERA_SPEED_UNITS_PER_MS) / 1000);
}

// `onSettle`, if given, fires once the camera has actually finished moving
// (Leaflet's 'moveend', which also fires immediately if flyTo has nothing
// to animate) rather than the instant this function is called — used so a
// caller can hold the POV banner glow back until the pan is done, instead
// of lighting it up while the map is still visibly sliding to the new spot.
// Guards against a newer navigation firing this callback late: captures
// curCh/curPhase at call time and only runs onSettle if they still match
// when 'moveend' arrives.
function flyToCurrentPOV(onSettle){
  // Zoom to the POV character for this chapter (unless Free Look is on)
  const povId = chapterPOV[curCh];
  if(!povId || freeLook){ if(onSettle) onSettle(); return; }
  const povChar = allChars.find(c => c.id === povId);
  if(!povChar){ if(onSettle) onSettle(); return; }
  const pos = getPos(povChar, curCh);
  if(!pos){ if(onSettle) onSettle(); return; }
  if(onSettle){
    const ch = curCh, phase = curPhase;
    map.once('moveend', function(){
      if(curCh === ch && curPhase === phase) onSettle();
    });
  }
  // Use the anchor position (not the ribbon offset)
  // Smooth pan/zoom to the character
  map.flyTo(pos.pos, getSnapZoom(), {
    animate: true,
    duration: flyDurationSeconds(map.getCenter(), pos.pos),
    easeLinearity: 0.2
  });
}

// ─── Chapter Reveal ─────────────────────────────────────────────────────────
// Every chapter opens the way the books themselves do: before anything
// else, just a name — no marker, no location, nothing. On "finished", the
// map reappears already framed on the confirmed location and that chapter's
// own POV character gets a glowing banner that stays lit for as long as the
// reader remains on this chapter (see `currentGlowId` below).
//
// This used to be reserved for a POV character's own series debut. It now
// fires for every chapter, on every navigation path (Next, Prev, dropdown
// jump) — same "no seen-it flag, fires every time" rule the debut version
// used, just no longer restricted to debuts.

// Tracks which character's banner should carry the persistent glow right
// now — the current chapter's own POV, or null while the reveal is up (no
// markers are on screen at all during the dim). Read by every renderMarkers()
// call so a zoom, a filter toggle, or any other incidental re-render doesn't
// drop the glow while the reader is still on this chapter.
let currentGlowId = null;

// Tracks which character's glow-in animation has already actually played
// during the reader's current stay on this chapter/state. renderMarkers()
// tears down and rebuilds every marker's DOM from scratch on every single
// call — every travel-animation frame, every zoom, the redundant "settle"
// render right after a pan or a travel walk finishes — so re-adding the
// animated `banner-glow` class each time would restart its CSS keyframe
// from 0% opacity every call: a visible flash-to-invisible-and-back on
// every one of those re-renders, not just the first. Once a character's
// glow-in has actually played, renderMarkers() switches later calls for
// that same glowId to the static, already-settled `banner-glow-static`
// class instead, so the banner just stays lit. Reset to null everywhere
// `currentGlowId` is reset to null, so the next real reveal plays fresh.
let glowRevealPlayedFor = null;

// Chapter titles look like "Eddard IV" (see allChapters) — the reveal only
// ever shows the POV's own first name, exactly the way the books head each
// chapter. The roman numeral (a wiki-style aid, not part of the book's own
// heading) stays visible in the header (#chDisplay) and the jump dropdown.
// Some prologue/epilogue entries also carry a parenthetical POV credit
// (e.g. "Prologue (Cressen)" in a later book) for the dropdown's benefit —
// that credit is exactly the kind of name this reveal exists to hold back,
// so it's stripped too, same as the roman numeral. AGOT's own "Prologue"
// has neither suffix, so it passes through unchanged.
function chapterRevealText(ch){
  return getChObj(ch).name
    .replace(/\s*\([^)]*\)\s*$/, '')
    .replace(/\s+[IVXLCDM]+$/, '');
}

function showChapterReveal(name){
  const overlay = document.getElementById('chapterRevealOverlay');
  document.getElementById('chapterRevealName').textContent = name;
  document.getElementById('map').classList.add('map-dimmed');
  overlay.classList.remove('revealing');
  overlay.classList.add('visible');
  void overlay.offsetWidth; // force reflow so the reveal animation restarts every time
  overlay.classList.add('revealing');
}

function hideChapterReveal(){
  const overlay = document.getElementById('chapterRevealOverlay');
  overlay.classList.remove('visible', 'revealing');
  document.getElementById('map').classList.remove('map-dimmed');
}

// Every chapter-navigation path (Next, Prev, dropdown jump) ends up here
// once curCh/curPhase are already set.
function renderChapterMap(){
  if(curPhase === 'before'){
    // Nothing should be visible yet — clear every marker/dot/line off the
    // map, then silently snap the camera to this chapter's own POV
    // character's LAST KNOWN position (see below), entirely behind the
    // dimmed overlay, so the reveal never involves a visible pan once it
    // lifts.
    Object.values(markers).forEach(m => map.removeLayer(m));
    Object.keys(markers).forEach(k => delete markers[k]);
    if(window._leaderLines) window._leaderLines.forEach(l => map.removeLayer(l));
    window._leaderLines = [];
    Object.keys(dots).forEach(k => delete dots[k]);

    const povId = chapterPOV[curCh];
    const povChar = povId ? allChars.find(c => c.id === povId) : null;
    // Snap silently to the character's LAST KNOWN (already-revealed)
    // position — not where they'll end up. This used to look ahead at
    // phase:'after' so the reveal never involved a visible pan once it
    // lifted; that's exactly backwards for a travel tracker, since it
    // meant the map had already jumped to the new spot before the reader
    // even opened the chapter. The camera now rests wherever the character
    // actually was as of "before," so the travel animation on "finished"
    // (see below) has a real, visible starting point to move from.
    const lastKnown = povChar ? getPos(povChar, curCh, 'before') : null;
    if(lastKnown && !freeLook) map.setView(lastKnown.pos, getSnapZoom(), {animate:false});

    currentGlowId = null;
    glowRevealPlayedFor = null;
    showChapterReveal(chapterRevealText(curCh));
    return;
  }

  hideChapterReveal();
  // Nothing renders at all until the camera has actually finished panning
  // to the new POV — no interim, non-glowing render either, since that
  // still left every banner visibly sliding across the map while it
  // moved. The reveal now happens as a single event: flyToCurrentPOV()'s
  // onSettle fires only once the pan is fully done (Leaflet's 'moveend',
  // or immediately if there's nothing to animate), and that's the first
  // and only renderMarkers() call for this transition.
  currentGlowId = null;
  glowRevealPlayedFor = null;
  const povId = chapterPOV[curCh] || null;
  flyToCurrentPOV(() => {
    currentGlowId = povId;
    renderMarkers(curCh, currentGlowId);
  });
}

// Cancellation token for whatever travel animation is currently in flight
// (if any) — a fresh navigation (Next again, Prev, dropdown jump) sets
// `cancelled` so the old animation's in-progress frames/pauses stop
// touching the map instead of fighting the new render.
let travelToken = null;

function setChapter(n, phase){
  if(travelToken) travelToken.cancelled = true;
  curCh = Math.max(0, Math.min((allChapters.length - 1), n));
  curPhase = (phase === 'after') ? 'after' : 'before';
  updateChapterUI();
  renderChapterMap();
}

// ─── CHARACTER TRAVEL ANIMATION ─────────────────────────────────────────────
// Fires only for the specific "this chapter's own before → this chapter's
// own after" step (see stepCh() below) — the one moment where a position
// change can be real, per-chapter travel rather than just jumping between
// unrelated chapters. Order of operations, per the current design:
//   1. Show the "finished" banner at each character's LAST KNOWN spot
//      (nothing has moved yet, visually).
//   2. Walk every character who actually moved this chapter from their old
//      spot to their new one, in order (see below), pausing at any real
//      confirmed stop along the way.
//   3. Settle into the normal static "after" render/camera.

// Every character whose confirmed arrival changed this chapter. Each mover
// carries its own ordered `stops` list (see buildJourneyStops) — the full
// path from last-known to newly-confirmed, including any real stops along
// the way.
function getChapterMovers(ch){
  return allChars.filter(c => c.isPov).map(c => {
    const prevArrival = getActiveArrival(c, ch, 'before');
    const nextArrival = getActiveArrival(c, ch, 'after');
    if(!prevArrival || !nextArrival || prevArrival === nextArrival) return null;
    const stops = buildJourneyStops(c, prevArrival, nextArrival);
    if(stops.length < 2) return null;
    // Same place under a different entry (e.g. a status-only update) isn't
    // a move — nothing to animate.
    if(posKey(stops[0].resolved.pos) === posKey(stops[stops.length-1].resolved.pos)) return null;
    return { c, stops };
  }).filter(Boolean);
}

// Orders a set of mover-groups (each already a list of movers travelling
// together) per the rule: explicit chronological order first, when the
// data actually states it (an optional `travelOrder` number on the
// destination arrival entry); otherwise the chapter's own POV character
// goes first; otherwise alphabetical by character name. Mutates in place.
function orderGroups(groups, ch){
  const povId = chapterPOV[ch];
  const explicitOrder = (group) => {
    let val = null;
    group.forEach(m => {
      const eo = m.stops[m.stops.length - 1].entry.travelOrder;
      if(eo != null) val = (val == null) ? eo : Math.min(val, eo);
    });
    return val;
  };
  const leadName = (group) => group.map(m => m.c.name).sort()[0];
  groups.sort((ga, gb) => {
    const ea = explicitOrder(ga), eb = explicitOrder(gb);
    if(ea != null || eb != null){
      if(ea == null) return 1;
      if(eb == null) return -1;
      if(ea !== eb) return ea - eb;
    }
    const aPov = ga.some(m => m.c.id === povId), bPov = gb.some(m => m.c.id === povId);
    if(aPov !== bPov) return aPov ? -1 : 1;
    return leadName(ga).localeCompare(leadName(gb));
  });
}

// Groups this chapter's movers by where they're starting FROM — characters
// who genuinely start the chapter in the same place are candidates for
// "traveling together"; characters starting somewhere else entirely are
// simply a separate, sequenced story. Returns an ordered array of
// mover-group arrays, or null if nobody moved this chapter.
function buildTravelPlan(ch){
  const movers = getChapterMovers(ch);
  if(!movers.length) return null;
  const byStart = {};
  movers.forEach(m => {
    const key = posKey(m.stops[0].resolved.pos);
    (byStart[key] = byStart[key] || []).push(m);
  });
  const clusters = Object.values(byStart);
  orderGroups(clusters, ch);
  return clusters;
}

function sleep(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }
function easeInOutQuad(t){ return t < 0.5 ? 2*t*t : -1 + (4 - 2*t) * t; }

// Distance-based, not time-based, same reasoning as the camera's own
// flyDurationSeconds() above — a short local hop and a cross-continent
// journey shouldn't take the same amount of time, but nothing should feel
// instant or endless either.
// Slowed 3x across the board (speed + both duration bounds scaled together,
// per explicit request — "start with 3x slower") so a short local hop and a
// cross-continent journey are both proportionally slower, not just legs
// that were already hitting the old ceiling.
const TRAVEL_SPEED_UNITS_PER_MS = 0.5 / 3;
const TRAVEL_MIN_DURATION_MS = 900 * 3;
const TRAVEL_MAX_DURATION_MS = 6000 * 3;
const TRAVEL_PAUSE_MS = 900; // how long a real, confirmed stop holds the travel

// Live mid-animation position per character id, in the same shape getPos()
// returns ({from,to,pos,place,note,status,...}). Seeded from each
// character's BEFORE-phase (last known) position the moment a chapter is
// marked finished, then updated as their own leg of the journey plays out
// — this is what lets renderMarkers() show "last known location" first and
// only move a character once their own animation actually reaches them.
let travelDisplayPos = {};
function initTravelDisplayState(ch){
  travelDisplayPos = {};
  allChars.filter(c => c.isPov).forEach(c => { travelDisplayPos[c.id] = getPos(c, ch, 'before'); });
}

function posAtLegProgress(leg, t){
  if(leg.kind === 'road') return roadPosAtDistance(leg.roadId, leg.distA + (leg.distB - leg.distA) * t);
  return [ leg.fromPos[0] + (leg.toPos[0]-leg.fromPos[0]) * t, leg.fromPos[1] + (leg.toPos[1]-leg.fromPos[1]) * t ];
}

// Camera tracks the moving group in real time (map.setView() every frame,
// not a competing flyTo) — same approach the original animation used.
// Follows the chapter's own POV character if they're among this group,
// otherwise whoever's leading it. Zoom holds steady during the walk;
// flyToCurrentPOV() does the final settle once everything's arrived.
function followTravelCamera(pos, group, ch){
  if(freeLook) return;
  map.setView(pos, map.getZoom(), { animate:false });
}

// Animates one shared leg (all of `group` moving from stops[atIndex] to
// stops[atIndex+1] together) and leaves travelDisplayPos/the map showing
// the arrival at the far end when it resolves.
function animateLeg(group, atIndex, ch, token){
  const entryA = group[0].stops[atIndex].entry, entryB = group[0].stops[atIndex+1].entry;
  const leg = legBetween(entryA, entryB);
  const destResolved = group[0].stops[atIndex+1].resolved;
  if(!leg){
    // No walkable path (e.g. a road still missing traced waypoints) —
    // snap straight to the destination rather than leave anyone stranded.
    group.forEach(m => { travelDisplayPos[m.c.id] = destResolved; });
    renderMarkers(ch, currentGlowId, c => travelDisplayPos[c.id] || null);
    return Promise.resolve();
  }
  return new Promise(resolve => {
    const t0 = performance.now();
    function frame(now){
      if(token.cancelled) return resolve();
      const raw = Math.min(1, (now - t0) / Math.max(1, Math.min(TRAVEL_MAX_DURATION_MS, Math.max(TRAVEL_MIN_DURATION_MS, leg.length / TRAVEL_SPEED_UNITS_PER_MS))));
      const pos = posAtLegProgress(leg, easeInOutQuad(raw));
      group.forEach(m => { travelDisplayPos[m.c.id] = { ...destResolved, pos }; });
      renderMarkers(ch, currentGlowId, c => travelDisplayPos[c.id] || null);
      followTravelCamera(pos, group, ch);
      if(raw < 1) requestAnimationFrame(frame);
      else resolve();
    }
    requestAnimationFrame(frame);
  });
}

// Walks a group of co-located movers forward stop by stop. While every
// remaining member's next stop is the same place, they move together as
// one leg (Rule 3: companions travel together). The moment their next
// stops differ, this is a real separation: order the resulting sub-groups
// (see orderGroups) and play each one in full — snapping the camera back
// to the shared split point before each, since that's every subsequent
// sub-group's own true "last known location" until their own leg starts.
async function playGroup(members, atIndex, ch, token){
  let current = members;
  while(true){
    if(token.cancelled) return;
    const withNext = current.filter(m => atIndex + 1 < m.stops.length);
    if(!withNext.length) return;
    const byKey = {};
    withNext.forEach(m => {
      const key = posKey(m.stops[atIndex+1].resolved.pos);
      (byKey[key] = byKey[key] || []).push(m);
    });
    const keys = Object.keys(byKey);
    if(keys.length === 1){
      await animateLeg(withNext, atIndex, ch, token);
      if(token.cancelled) return;
      if(withNext[0].stops[atIndex+1].isPause){
        // A real, confirmed stop mid-journey — hold here and surface its
        // tooltip briefly so the reader can see what happened, instead of
        // sailing straight through it.
        withNext.forEach(m => { const mk = markers[m.c.id]; if(mk) mk.openTooltip(); });
        await sleep(TRAVEL_PAUSE_MS);
        if(token.cancelled) return;
        withNext.forEach(m => { const mk = markers[m.c.id]; if(mk) mk.closeTooltip(); });
      }
      atIndex++;
      current = withNext;
      continue;
    }
    const subGroups = keys.map(k => byKey[k]);
    orderGroups(subGroups, ch);
    for(const sg of subGroups){
      if(token.cancelled) return;
      map.setView(members[0].stops[atIndex].resolved.pos, getSnapZoom(), { animate:false });
      await playGroup(sg, atIndex, ch, token);
    }
    return;
  }
}

async function playTravelPlan(clusters, ch, token){
  for(const cluster of clusters){
    if(token.cancelled) return;
    map.setView(cluster[0].stops[0].resolved.pos, getSnapZoom(), { animate:false });
    await playGroup(cluster, 0, ch, token);
  }
}

// The one animated navigation path: advancing from THIS chapter's own
// "before" into its own "after" (Next, from an opening). Every other path
// (Prev, dropdown jump, or Next crossing into the NEXT chapter's opening)
// stays a plain instant setChapter() — there's no single chapter's worth of
// travel to show in those cases, just a jump to wherever the reader landed.
async function advanceChapterAnimated(){
  if(travelToken) travelToken.cancelled = true;
  const token = { cancelled: false };
  travelToken = token;
  const ch = curCh;
  curPhase = 'after';
  updateChapterUI();
  hideChapterReveal();

  const povId = chapterPOV[ch] || null;
  const plan = buildTravelPlan(ch);

  if(plan && !freeLook){
    // A real walk to show. The camera is already correctly sitting at the
    // mover's own last-known spot — pre-positioned silently behind the dim
    // during "before" (see renderChapterMap()) — so revealing the banner
    // right away is safe here: marker and camera move together for the
    // rest of this step (see followTravelCamera()), so the banner is never
    // ahead of where the camera actually is.
    currentGlowId = povId;
    initTravelDisplayState(ch);
    renderMarkers(ch, currentGlowId, c => travelDisplayPos[c.id] || null);

    await playTravelPlan(plan, ch, token);
    if(token.cancelled) return; // a newer navigation has already taken over

    // Settle into the normal static "after" state. Same currentGlowId as
    // above, so renderMarkers() applies the static (non-restarting) glow
    // class here instead of replaying the fade-in — see
    // `glowRevealPlayedFor`. flyToCurrentPOV() is a no-op here in
    // practice, since the walk's own camera-follow already left the view
    // exactly where this would fly to.
    renderMarkers(ch, currentGlowId);
    flyToCurrentPOV();
  } else {
    // Nothing to walk — either genuinely no movement this chapter, or (as
    // with a character's own debut chapter) there's no prior position to
    // walk FROM at all. In the debut case specifically, "before" had
    // nothing to silently pre-position the camera to (see
    // renderChapterMap()), so the camera is still wherever the PREVIOUS
    // chapter left it — a real pan may still be needed to reach the true
    // location, even though no marker is walking. Hold the banner back
    // exactly like the Prev/dropdown-jump reveal path: render nothing
    // until that pan is fully settled, then reveal once, already at the
    // right spot. If no pan is actually needed (the common case — nothing
    // moved and the camera was already there), flyToCurrentPOV()'s
    // onSettle fires immediately and this is visually indistinguishable
    // from an instant reveal.
    currentGlowId = null;
    glowRevealPlayedFor = null;
    flyToCurrentPOV(() => {
      currentGlowId = povId;
      renderMarkers(ch, currentGlowId);
    });
  }
}

// Every other chapter's "before" now dims the map to the Chapter Reveal
// (see renderChapterMap()), so there's never a marker already on screen to
// walk from on THOSE steps — only the specific before→after step within
// one chapter (handled by advanceChapterAnimated() above) has anything to
// animate.
function stepCh(dir){
  if(dir > 0 && curPhase === 'before'){
    advanceChapterAnimated();
    return;
  }
  const idx = Math.max(MIN_STEP, Math.min(MAX_STEP, toIndex(curCh, curPhase) + dir));
  const next = fromIndex(idx);
  setChapter(next.ch, next.phase);
}

// ─── FLIGHT PATH HELPER ────────────────────────────────────────────────────
// Multi-leg version of legBetween() (see the TRAVEL ANIMATION section
// above), used by the 🧭 Untraced Routes dev tool to measure a whole
// arrival-to-arrival journey's straight-line hops. The travel animation
// itself walks stop-by-stop via buildJourneyStops()/legBetween() directly,
// since it also needs to know about pauses at in-between arrivals, which
// this transit-only chain doesn't carry.
//
// Turns the chain of transit legs between two arrivals into an ordered list
// of {kind, length, ...} segments the animation can walk at constant speed.
// Each segment is either "road" (follows a named road's real waypoints
// between two pct values) or "straight" (a fallback line between two
// points — used across different roads, fixed points, or an UNTRACED
// custom route that hasn't been walked with the Route Tracer yet).
function buildFlightPath(c, prevArrival, nextArrival){
  // If this arrival has a real traced route (from the 🧭 Untraced Routes
  // dev tool), use it verbatim as one continuous path instead of the
  // straight-line/transit-chain approximation below — same idea as a named
  // road, but a one-off path specific to this character's journey.
  if(nextArrival.route && nextArrival.route.length > 1){
    const pts = nextArrival.route;
    const dists = [0];
    for(let i=1;i<pts.length;i++){
      const dLat = pts[i][0]-pts[i-1][0], dLng = pts[i][1]-pts[i-1][1];
      dists.push(dists[i-1] + Math.sqrt(dLat*dLat+dLng*dLng));
    }
    const legs = [];
    for(let i=0;i<pts.length-1;i++){
      legs.push({ kind:'straight', fromPos:pts[i], toPos:pts[i+1], length: dists[i+1]-dists[i] });
    }
    return legs;
  }

  const chain = getTransitChain(c, prevArrival, nextArrival);
  const rawStops = [prevArrival, ...chain, nextArrival];
  const legs = [];
  for(let i = 0; i < rawStops.length - 1; i++){
    const leg = legBetween(rawStops[i], rawStops[i+1]);
    if(leg) legs.push(leg);
  }
  return legs;
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
// Re-render on zoom so leader line offsets stay proportional. Pass the
// tracked glow id through so zooming mid-chapter doesn't drop the glow.
map.on('zoomend', function(){ renderMarkers(curCh, currentGlowId); });

  const bookId = params.get('book') || 'agot';

  const [locData, bookData] = await Promise.all([
    fetch('locations.json').then(r => r.json()),
    fetch(bookId + '.json').then(r => r.json())
  ]);

  roads = locData.roads;
  allChapters = bookData.allChapters;
  allChars = bookData.allChars;
  chapterPOV = bookData.chapterPOV;

  document.getElementById('title').textContent = (bookData.icon || '⚔') + ' ' + bookData.title;
  document.title = bookData.title + ' — Reading Companion';
  const bookMenuEl = document.getElementById('bookMenu');
  if (bookMenuEl) bookMenuEl.value = bookId;

  const jumpMenuEl = document.getElementById('jumpMenu');
  allChapters.forEach(c => {
    const o = document.createElement('option');
    o.value = c.n;
    o.textContent = `Ch. ${c.n} — ${c.name}`;
    jumpMenuEl.appendChild(o);
  });

  MAX_STEP = toIndex(allChapters.length - 1, 'after');

  setChapter(0, 'before');
})();
